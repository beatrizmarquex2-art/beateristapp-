<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paul promos: reels e artes (salas de 4 e Black Friday)</title>
<link rel="stylesheet" href="../../css/fonts.css">
<style>
:root{--navy:#17365B;--deep:#0f2547;--sun:#f6b93b;--red:#bd1733;--cream:#fff6e3;--ink:#142036}
*{box-sizing:border-box;margin:0}html,body{background:#000;overflow:hidden}
#s{position:relative;overflow:hidden;font-family:"Hanken Grotesk",system-ui,sans-serif;color:var(--cream);background:var(--navy)}
.reel,.story{width:1080px;height:1920px}.post{width:1080px;height:1080px}
.bg{position:absolute;inset:0;background:radial-gradient(130% 80% at 50% 0,#2a5a96 0,var(--navy) 55%,var(--deep) 100%)}
.bg::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.09) 3px,transparent 3.6px);background-size:46px 46px}
.stripe{position:absolute;left:-10%;right:-10%;height:150px;background:var(--red);transform:rotate(-6deg);box-shadow:0 10px 0 rgba(0,0,0,.25)}
.T{font-family:Anton,Impact,sans-serif;text-transform:uppercase;letter-spacing:.01em;line-height:.98}
.M{font-family:"Permanent Marker","Gochi Hand",cursive}
.abs{position:absolute}.c{left:0;right:0;text-align:center}
.paul{position:absolute;filter:drop-shadow(0 14px 0 rgba(0,0,0,.28))}
/* animações: tudo começa quando <body class="go"> (os 9 s do reel) */
.pop{opacity:0;transform:scale(.4) rotate(-6deg)}.go .pop{animation:pop .55s cubic-bezier(.2,1.6,.4,1) forwards;animation-delay:var(--d,0s)}
@keyframes pop{to{opacity:1;transform:none}}
.up{opacity:0;transform:translateY(80px)}.go .up{animation:up .6s ease-out forwards;animation-delay:var(--d,0s)}
@keyframes up{to{opacity:1;transform:none}}
.fromR{opacity:0;transform:translateX(420px)}.go .fromR{animation:fr .8s cubic-bezier(.2,1.2,.3,1) forwards;animation-delay:var(--d,0s)}
@keyframes fr{to{opacity:1;transform:none}}
.fromL{opacity:0;transform:translateX(-420px)}.go .fromL{animation:fl .8s cubic-bezier(.2,1.2,.3,1) forwards;animation-delay:var(--d,0s)}
@keyframes fl{to{opacity:1;transform:none}}
.col{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:270px 60px 330px;text-align:center}
.pw{position:relative}.pw img{display:block;width:100%;height:auto;filter:drop-shadow(0 14px 0 rgba(0,0,0,.28))}
.pw .sign{padding:0 2%}
.bob{animation:bob 1.1s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-16px) rotate(1.5deg)}}
.pulse{animation:pulse .9s ease-in-out infinite alternate}@keyframes pulse{to{transform:scale(1.06)}}
.conf i{position:absolute;top:-60px;width:22px;height:34px;border-radius:4px;opacity:0}.go .conf i{animation:fall var(--t,3s) linear infinite;animation-delay:var(--d,0s)}
@keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:1;transform:translateY(2000px) rotate(720deg)}}
.chip{display:inline-block;padding:18px 34px;border-radius:26px;border:6px solid var(--ink);box-shadow:0 10px 0 var(--ink);font:400 56px/1 Anton,Impact,sans-serif;text-transform:uppercase;color:var(--ink)}
.price{background:var(--sun);color:var(--ink);border:8px solid var(--ink);border-radius:36px;box-shadow:0 14px 0 var(--ink);padding:26px 40px;text-align:center}
.cta{display:inline-block;background:var(--cream);color:var(--ink);border:6px solid var(--ink);border-radius:999px;padding:22px 50px;font:400 54px/1 Anton,Impact,sans-serif;text-transform:uppercase;box-shadow:0 10px 0 var(--ink)}
.badge{position:absolute;background:var(--red);color:#fff;border:6px solid #fff;border-radius:999px;font:400 50px/1 Anton,Impact,sans-serif;text-transform:uppercase;padding:18px 40px;box-shadow:0 10px 0 rgba(0,0,0,.3)}
.sign{position:absolute;display:grid;place-items:center;text-align:center;color:var(--ink);padding:0 3%}
.sign .T{color:var(--ink)}
.typed{overflow:hidden;white-space:nowrap;border-right:0;max-width:0}.go .typed{animation:typed 1.2s steps(22) forwards;animation-delay:var(--d,0s)}@keyframes typed{to{max-width:100%}}
</style></head><body>
<div id="s"></div>
<script>
const Q=new URLSearchParams(location.search); const M=Q.get('m')||'reelA';
const P=(n)=>`../../assets/paul/colorido/paul-${n}.webp`;
const S=document.getElementById('s');
const el=(cls,html,style='')=>`<div class="${cls}" style="${style}">${html}</div>`;
const conf=(n=26)=>`<div class="conf abs" style="inset:0;pointer-events:none">${Array.from({length:n},(_,i)=>`<i style="left:${(i*37)%100}%;background:${['#f6b93b','#bd1733','#2d8cff','#fff6e3','#7a5cff'][i%5]};--d:${(i%9)*.25}s;--t:${2.6+(i%5)*.4}s"></i>`).join('')}</div>`;
const mk={
  /* placa: o Paul aponta e o texto fica DENTRO da placa (posição em %, não pula de lugar) */
  /* REELS e STORIES: coluna centralizada na faixa segura (nada se sobrepõe, o espaço se reparte sozinho) */
  reelA:()=>({cls:'reel',html:`<div class="bg"></div><div class="stripe" style="top:230px"></div>
    <div class="col">
      ${el('T up','jogos da beaterista','font-size:58px;color:#fff;--d:.1s')}
      <div class="pw fromL" style="width:960px;--d:.4s"><img src="${P('placa')}">
        <div class="sign" style="left:51%;top:18%;width:42%;height:31%">${el('T pop','agora dá pra jogar em 4!','font-size:52px;--d:1.3s')}</div></div>
      ${el('M up','cada um na sua casa, na mesma sala','font-size:54px;color:var(--sun);--d:2.4s')}
      ${el('up','<span class="chip" style="background:#fff6e3;font-size:42px">memória</span> <span class="chip" style="background:var(--sun);font-size:42px">uno</span> <span class="chip" style="background:#9fe3ff;font-size:42px">stop</span> <span class="chip" style="background:#ffb3c1;font-size:42px">cara a cara</span>','--d:3.4s;line-height:2.1')}
      ${el('up','<span class="cta pulse">jogos.beaterista.com.br</span>','--d:5.2s;font-size:48px')}
    </div>`}),
  reelB:()=>({cls:'reel',html:`<div class="bg"></div>
    <div class="col" style="gap:20px">
      <div style="display:flex;align-items:center;justify-content:space-between;width:100%;gap:0">
        <div style="text-align:left;flex:1">
          ${el('T up','psiu…','font-size:170px;color:var(--sun);--d:1.2s;transform:rotate(-5deg);display:block')}
          ${el('badge pop','black friday','position:relative;display:inline-block;--d:2s;font-size:44px;margin-top:20px')}
          ${el('T up','passe anual','font-size:88px;color:#fff;--d:2.8s;margin-top:22px')}</div>
        <img class="paul fromR" src="${P('espiando')}" style="position:relative;width:430px;margin-right:-30px;--d:.2s;flex:none">
      </div>
      <div class="price pop" style="width:100%;--d:3.6s">
        ${el('M','um ano inteiro de música, jogos e descobertas','font-size:38px;color:var(--ink)')}
        ${el('T','R$ 49,90','font-size:150px;color:var(--red);margin:4px 0')}
        ${el('T','só até 15/12 · à vista no pix','font-size:46px;color:var(--ink)')}</div>
      ${el('up','<span class="cta pulse">jogos.beaterista.com.br</span>','--d:5.6s;font-size:48px;margin-top:10px')}
    </div>`}),
  reelC:()=>({cls:'reel',html:`<div class="bg"></div>${conf(30)}
    <div class="col" style="gap:14px">
      ${el('T up','4 amigos','font-size:170px;color:var(--sun);--d:.2s')}
      ${el('T up','1 sala','font-size:170px;color:#fff;--d:.8s;margin-top:-14px')}
      ${el('up',`<span class="chip pop" style="background:#fff6e3;--d:1.6s">ana</span> <span class="chip pop" style="background:var(--sun);--d:2.1s">bia</span><br><span class="chip pop" style="background:#9fe3ff;--d:2.6s;margin-top:30px;display:inline-block">cris</span> <span class="chip pop" style="background:#ffb3c1;--d:3.1s;margin-top:30px;display:inline-block">duda</span>`,'--d:1.4s;line-height:1.4;margin-top:14px')}
      ${el('M up','quem ganha leva ★ ✨','font-size:58px;color:var(--sun);--d:4s;margin-top:10px')}
      <div class="pw pop" style="width:380px;--d:3.6s"><img src="${P('festa')}"></div>
      ${el('up','<span class="cta pulse">memória · uno · stop · cara a cara</span>','--d:4.8s;font-size:32px')}
    </div>`}),
  /* ARTES: posts 1080×1080 (margem de 60) */
  'bf-post':()=>({cls:'post',html:`<div class="bg"></div>
    ${el('badge','black friday','left:60px;top:60px;font-size:60px')}
    ${el('abs T','só até 15/12 · pix','right:60px;top:78px;font-size:54px;color:var(--sun)')}
    <div class="pw abs" style="left:190px;top:185px;width:700px"><img src="${P('placa')}"><div class="sign" style="left:51%;top:18%;width:42%;height:31%">${el('T','passe anual','font-size:36px')}${el('T','R$ 49,90','font-size:58px;color:var(--red);white-space:nowrap')}</div></div>
    ${el('abs c M','um ano inteiro de música, jogos e descobertas','top:850px;font-size:40px;color:var(--cream)')}
    ${el('abs c','<span class="cta">jogos.beaterista.com.br</span>','bottom:60px;font-size:36px')}`}),
  'bau-post':()=>({cls:'post',html:`<div class="bg"></div>
    ${el('abs c T','juntou ★? abriu o baú!','top:60px;font-size:92px;color:var(--sun)')}
    <div class="pw abs" style="left:50%;margin-left:-340px;top:185px;width:680px"><img src="${P('bau')}"></div>
    ${el('abs c M','a cada 15 ★, uma roleta!','top:850px;font-size:48px;padding:0 60px')}
    ${el('abs c','<span class="cta">jogos.beaterista.com.br</span>','bottom:60px;font-size:36px')}`}),
  'presente-post':()=>({cls:'post',html:`<div class="bg"></div>${conf(20)}
    <div class="pw abs" style="left:70px;top:130px;width:470px"><img src="${P('presente')}"></div>
    ${el('abs T','um ano inteiro de','left:620px;top:130px;font-size:52px;color:#fff;white-space:nowrap')}
    ${el('abs T','música, jogos e descobertas','left:620px;top:200px;width:400px;font-size:76px;color:var(--sun)')}
    ${el('abs M','passe anual do robôterista paul','left:620px;top:520px;width:400px;font-size:36px')}
    <div class="abs price" style="left:620px;top:690px;width:400px;padding:14px 22px">${el('T','R$ 49,90 pix','font-size:64px;color:var(--red);white-space:nowrap')}${el('T','black friday · até 15/12','font-size:30px')}</div>
    ${el('abs c','<span class="cta">jogos.beaterista.com.br</span>','bottom:60px;font-size:36px')}`}),
  /* STORIES 1080×1920 */
  'bf-story':()=>({cls:'story',html:`<div class="bg"></div><div class="stripe" style="top:230px"></div>
    <div class="col">
      ${el('badge','black friday','position:relative;font-size:76px')}
      <div class="pw" style="width:940px"><img src="${P('placa')}"><div class="sign" style="left:51%;top:18%;width:42%;height:31%">${el('T','passe anual','font-size:44px')}${el('T','R$ 49,90','font-size:70px;color:var(--red);white-space:nowrap')}</div></div>
      ${el('T','só até 15/12 · à vista no pix','font-size:66px;color:var(--sun)')}
      ${el('M','um ano inteiro de música, jogos e descobertas','font-size:52px')}
      ${el('','<span class="cta">jogos.beaterista.com.br</span>','font-size:48px')}
    </div>`}),
  'bau-story':()=>({cls:'story',html:`<div class="bg"></div><div class="stripe" style="top:230px"></div>
    <div class="col" style="gap:18px">
      ${el('T','juntou ★?','font-size:150px;color:var(--sun)')}${el('T','abriu o baú!','font-size:150px;color:#fff;margin-top:-18px')}
      <div class="pw" style="width:860px"><img src="${P('bau')}"></div>
      ${el('M','a cada 15 ★, uma roleta!','font-size:56px')}
      ${el('','<span class="cta">jogos.beaterista.com.br</span>','font-size:48px')}
    </div>`}),
  'presente-story':()=>({cls:'story',html:`<div class="bg"></div>${conf(28)}
    <div class="col" style="gap:12px">
      ${el('T','um ano inteiro de','font-size:80px;color:#fff')}${el('T','música, jogos','font-size:126px;color:var(--sun);margin-top:-6px')}${el('T','e descobertas!','font-size:126px;color:var(--sun);margin-top:-10px')}
      <div class="pw" style="width:360px;margin:8px 0"><img src="${P('presente')}"></div>
      <div class="price" style="width:880px;padding:18px 28px">${el('T','black friday','font-size:44px;color:var(--ink)')}${el('T','R$ 49,90 no pix','font-size:100px;color:var(--red)')}${el('T','só até 15/12','font-size:44px;color:var(--ink)')}</div>
      ${el('','<span class="cta">jogos.beaterista.com.br</span>','font-size:46px;margin-top:6px')}
    </div>`}),
};
const f=(mk[M]||mk.reelA)(); S.className=f.cls; S.innerHTML=f.html;
const imgs=[...document.images]; Promise.all([document.fonts.ready,...imgs.map((i)=>i.complete?1:new Promise((r)=>{i.onload=i.onerror=r;}))]).then(()=>{document.body.classList.add('go'); window.__ready=true;});
</script></body></html>
