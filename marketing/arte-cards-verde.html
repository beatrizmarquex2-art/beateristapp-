<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Arte dos Cards · combo em amarelo</title>
<link rel="stylesheet" href="../css/fonts.css">
<style>
/* A arte de venda dos Cards do Paul (mandada pela Bea) com a faixa do combo refeita em VERDE (vermelho parece "errado/cancelar"). Fundo = a arte original em entrada-telas/cards-venda-original.png */
*{box-sizing:border-box;margin:0}body{width:1080px;height:1350px;position:relative;overflow:hidden;background:#0d1a3a}
img.bg{position:absolute;inset:0;width:1080px;height:1350px}
.faixa{position:absolute;left:48px;top:989px;width:984px;height:160px;border-radius:40px;background:#f2a91b;box-shadow:inset 0 -6px 0 rgba(0,0,0,.15)}
.t{position:absolute;left:42px;top:34px;font:400 46px/1 Anton,sans-serif;color:#162146;letter-spacing:.02em;text-transform:uppercase}
.s{position:absolute;left:42px;top:98px;font:700 22px/1 "Hanken Grotesk",sans-serif;color:#162146}
.de{position:absolute;right:42px;top:28px;font:800 24px/1 "Hanken Grotesk",sans-serif;color:#162146;text-decoration:line-through}
.p{position:absolute;right:42px;top:50px;font:400 84px/1 Anton,sans-serif;color:#162146}
.pil{position:absolute;top:874px;width:176px;height:60px;border-radius:30px;background:#f2a91b;color:#162146;text-align:center;font:400 46px/62px Anton,sans-serif;box-shadow:0 3px 0 rgba(0,0,0,.25)}</style></head><body>
<img class="bg" src="entrada-telas/cards-venda-original.png" alt="">
<div class="faixa"><div class="t">combo os 3 baralhos</div><div class="s">360 cartas em PDF pra imprimir e recortar</div><div class="de">de R$ 59,70</div><div class="p">R$ 49,90</div></div>
<div class="pil" style="left:120px">R$ 19,90</div><div class="pil" style="left:452px">R$ 19,90</div><div class="pil" style="left:784px">R$ 19,90</div>
<script>Promise.all([].slice.call(document.images).map(function(im){return im.complete?0:new Promise(function(ok){im.onload=im.onerror=ok;});})).then(function(){return document.fonts.ready;}).then(function(){window.__pronto=true;});</script>
</body></html>
