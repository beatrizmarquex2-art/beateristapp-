<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Cores do botão de compra</title>
<link rel="stylesheet" href="../css/fonts.css">
<style>
*{box-sizing:border-box;margin:0}body{width:1100px;background:#0d1a3a;color:#fff7e6;font-family:"Hanken Grotesk",sans-serif;padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:22px}
.o{background:#12224a;border:1.5px solid rgba(255,255,255,.2);border-radius:20px;padding:16px}
.o h2{font:800 15px "Hanken Grotesk";letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px;opacity:.85}
.faixa{border-radius:18px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.faixa b{font:400 26px/1 Anton;text-transform:uppercase}.faixa small{display:block;font:700 12px "Hanken Grotesk";margin-top:6px}
.faixa .p{font:400 44px/1 Anton;text-align:right}.faixa .p s{display:block;font:800 13px "Hanken Grotesk"}
.btn{border-radius:14px;padding:15px;text-align:center;font:400 22px/1 Anton;letter-spacing:.05em;text-transform:uppercase;box-shadow:0 5px 0 rgba(0,0,0,.35)}
</style></head><body>
<div id="r"></div>
<script>
var O=[['A · creme (branco quente)','#fff7e6','#162146'],['B · roxo da teoria','#6a35c9','#fff'],['C · azul vivo','#2f6bff','#fff'],['D · azul-piscina','#17a2b8','#fff'],['E · laranja','#ff7a1a','#fff'],['F · rosa','#e8418c','#fff']];
document.getElementById('r').outerHTML=O.map(function(o){return '<div class="o"><h2>'+o[0]+'</h2><div class="faixa" style="background:'+o[1]+';color:'+o[2]+'"><div><b>combo os 3 baralhos</b><small>360 cartas em PDF pra imprimir e recortar</small></div><div class="p"><s>de R$ 59,70</s>R$ 49,90</div></div><div class="btn" style="background:'+o[1]+';color:'+o[2]+'">adquira já na lojinha</div></div>';}).join('');
Promise.all([].slice.call(document.images).map(function(im){return im.complete?0:new Promise(function(ok){im.onload=im.onerror=ok;});})).then(function(){return document.fonts.ready;}).then(function(){window.__pronto=true;});
</script></body></html>
