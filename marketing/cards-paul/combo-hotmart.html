<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Capa Hotmart · Combo dos 3 baralhos</title>
<link rel="stylesheet" href="../../css/fonts.css">
<style>
*{box-sizing:border-box;margin:0}html,body{width:1500px;height:1500px;background:#0a0f26;color:#fff7e6;font-family:"Hanken Grotesk",sans-serif;font-weight:800;overflow:hidden}
.st{position:relative;width:1500px;height:1500px;overflow:hidden;background:radial-gradient(120% 55% at 50% 0,#31408a 0,#162146 42%,#0a0f26 100%)}
.st:before{content:"";position:absolute;inset:0;background:radial-gradient(rgba(255,255,255,.06) 2px,transparent 2.4px) 0 0/34px 34px}
.abs{position:absolute}
.cd{left:0;right:0;top:44px;text-align:center;font:400 58px/1 Anton;letter-spacing:.2em}
.logo{left:50%;top:116px;width:560px;margin-left:-280px;filter:drop-shadow(0 6px 0 rgba(0,0,0,.35))}
.combo{left:0;right:0;top:378px;text-align:center;font:400 104px/1 Anton;letter-spacing:.06em;color:#f2a91b;text-transform:uppercase}
.sub{left:0;right:0;top:498px;text-align:center;font:400 52px/1 Anton;letter-spacing:.14em;text-transform:uppercase}
.card{position:absolute;width:430px;border-radius:26px;box-shadow:0 22px 46px rgba(0,0,0,.5)}
.sel{left:44px;top:44px;width:270px;height:270px;border-radius:50%;background:#f2a91b;color:#162146;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-8deg);border:6px solid #162146;font:400 46px/1 Anton;letter-spacing:.06em;z-index:5}.sel span{font-size:120px;line-height:.95}
.lab{position:absolute;top:1262px;z-index:8;width:430px;text-align:center;font:400 36px/1 Anton;letter-spacing:.04em;text-transform:uppercase}.lab small{display:inline;margin-left:12px;font:800 26px/1 "Hanken Grotesk";letter-spacing:.02em;margin-top:6px;opacity:.9}
.fita{left:0;right:0;bottom:0;height:150px;background:#fff7e6;color:#162146;display:flex;align-items:center;justify-content:center;font:400 54px/1 Anton;letter-spacing:.07em;z-index:6}
.p1{left:-40px;bottom:140px;height:250px;z-index:7}.p2{right:-40px;bottom:140px;height:250px;z-index:7}
</style></head><body><div class="st">
<div class="abs cd">CARDS DO</div>
<img class="abs logo" src="img/logo-roboterista-paul-branco.png" alt="">
<div class="abs combo">combo dos 3 baralhos</div>
<div class="abs sub">teoria · instrumentos · dicionário</div>
<img class="card" src="_out/teoria/card-pausa-de-seminima.png" style="left:66px;top:610px;transform:rotate(-7deg)">
<img class="card" src="_out/instrumentos/card-do-maior.png" style="left:535px;top:560px;z-index:2">
<img class="card" src="_out/dicionario/card-setlist.png" style="left:1004px;top:610px;transform:rotate(7deg)">
<div class="abs sel"><span>360</span>CARTAS</div>
<div class="lab" style="left:66px">teoria<small>150 cartas</small></div>
<div class="lab" style="left:535px">instrumentos<small>90 cartas</small></div>
<div class="lab" style="left:930px">dicionário<small>120 termos</small></div>
<div class="abs fita">PDF PRA IMPRIMIR E RECORTAR</div>
<img class="abs p1" src="img/paul-guitarra-1000.webp" alt=""><img class="abs p2" src="img/paul-bateria-1000.webp" alt="">
</div>
<script>Promise.all([].slice.call(document.images).map(function(im){return im.complete?0:new Promise(function(ok){im.onload=im.onerror=ok;});})).then(function(){return document.fonts.ready;}).then(function(){window.__pronto=true;});</script>
</body></html>
