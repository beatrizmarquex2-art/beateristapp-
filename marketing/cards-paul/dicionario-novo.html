@page{size:210mm 297mm;margin:0}*{box-sizing:border-box;margin:0}

.k .pauta:before{content:"";position:absolute;left:0;right:0;top:3.2mm;height:16.4mm;background:repeating-linear-gradient(#9aa2bb 0 .3mm,transparent .3mm 4.1mm);background-size:100% 16.7mm}

.capa .faixa b{position:relative;display:inline-block;background:#fff;padding:1.5mm 9mm;font:400 34pt/1 Anton;letter-spacing:.06em;text-transform:uppercase;border:.5mm solid #162146;border-radius:99mm}
