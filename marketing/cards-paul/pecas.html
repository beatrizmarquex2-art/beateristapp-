<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Peças de divulgação · Cards do Robôterista Paul</title>
<link rel="stylesheet" href="../../css/fonts.css">
<style>
/* Peças de divulgação dos baralhos (capa da Hotmart, carrossel do Instagram, cenas de story e reel). ?deck=instrumentos|dicionario&peca=hotmart|s1..s6|r1..r5 */
*{box-sizing:border-box;margin:0}
html,body{background:#0a0f26;-webkit-font-smoothing:antialiased}
body{font-family:"Hanken Grotesk",system-ui,sans-serif;font-weight:700;color:#fff7e6;overflow:hidden}
.st{position:relative;overflow:hidden;background:radial-gradient(120% 55% at 50% 0,#31408a 0,#162146 42%,#0a0f26 100%)}
.st::before{content:"";position:absolute;inset:0;background:radial-gradient(rgba(255,255,255,.06) 2px,transparent 2.4px) 0 0/34px 34px;pointer-events:none}
.abs{position:absolute}
.placa{background:#fffaf0;border-radius:999px;display:flex;align-items:center;gap:18px;padding:12px 34px 12px 16px;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.placa img:first-child{height:84px}.placa img:last-child{height:52px}
.logo{background:none;padding:0;filter:drop-shadow(0 6px 0 rgba(0,0,0,.35))}.logo img{display:block;width:100%}
h1,h2,.an{font-family:"Anton","Arial Black",Impact,sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.01em;line-height:.98}
.ouro{color:#f2a91b}.verm{color:#c81e2d}
.pill{display:inline-block;font:400 44px/1 "Anton",sans-serif;text-transform:uppercase;letter-spacing:.16em;color:#f2a91b}
.cta{display:inline-block;background:#c81e2d;color:#fff;font:400 64px/1 "Anton",sans-serif;padding:26px 54px 22px;border-radius:999px;box-shadow:0 8px 0 rgba(0,0,0,.3)}
.cardimg{display:block;border-radius:30px;box-shadow:0 22px 46px rgba(0,0,0,.5)}
.chip{display:inline-block;font:400 34px/1 "Anton",sans-serif;text-transform:uppercase;letter-spacing:.05em;padding:16px 28px 12px;border-radius:999px;color:#fff}
.num{font:400 150px/1 "Anton",sans-serif;color:#f2a91b}
.bx{background:rgba(255,255,255,.09);border-radius:34px;padding:34px 40px}
.passo{display:flex;gap:28px;align-items:center;background:rgba(255,255,255,.09);border-radius:34px;padding:28px 34px}
.passo b{flex:none;width:92px;height:92px;border-radius:50%;background:#f2a91b;color:#162146;font:400 60px/92px "Anton",sans-serif;text-align:center}
.passo span{font:800 40px/1.2 "Hanken Grotesk",sans-serif}
.sw{position:absolute;left:0;right:0;bottom:46px;text-align:center;font:800 30px/1 "Hanken Grotesk",sans-serif;letter-spacing:.04em;opacity:.9}
</style>
</head>
<body>
<div id="r"></div>
<script>
(function(){
  var Q=new URLSearchParams(location.search), DECK=Q.get('deck')||'instrumentos', PECA=Q.get('peca')||'hotmart';
  var A='../../assets/', OUT='_out/'+DECK+'/';
  var LOGO='img/logo-roboterista-paul-branco.png', SELO=A+'logo-512.png', NOME=A+'logo-nome.png';
  var HD={bateria:'img/paul-bateria-1000.webp',teclado:'img/paul-teclado-1000.webp',guitarra:'img/paul-guitarra-1000.webp',quadro:A+'originals/paul-professor-quadro-hd.png',partitura:A+'paul/colorido/paul-lendo-partitura.webp',ouvindo:A+'paul/colorido/paul-ouvindo.webp'};
  var SITE='jogos.beaterista.com.br';
  var D={
    instrumentos:{
      nome:'INSTRUMENTOS', total:90, sing:'cartas', ganchoA:['90 CARTINHAS','PRA APRENDER'], ganchoB:'BATERIA, TECLADO E VIOLÃO',
      pauls:['guitarra','teclado','bateria'], hero:'teclado',
      stats:[['90','cartas'],['3','instrumentos'],['6','fases cada']],

      beneficio:'cada palavra com desenho, explicação curta e uma dica',
      reel:['75 PALAVRAS DE MÚSICA','SÍNCOPE','CLAVE DE SOL','TABLATURA']
    }
  }[DECK];
  var slug=function(t){return t.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');};
  var card=function(i){return OUT+'card-'+slug(D.cards[i])+'.png';};

      '<img class="abs cardimg" src="'+card(0)+'" style="left:96px;top:690px;width:440px;transform:rotate(-9deg)">'+
      '<img class="abs cardimg" src="'+card(2)+'" style="right:96px;top:690px;width:440px;transform:rotate(9deg)">'+

      '<img class="abs" src="'+HD[D.pauls[0]]+'" style="left:-40px;bottom:60px;height:270px;z-index:7"><img class="abs" src="'+HD[D.pauls[2]]+'" style="right:-40px;bottom:60px;height:270px;z-index:7">'+
      '</div>';

  } else if(PECA==='s2'){
    h='<div class="st" style="width:1080px;height:1350px">'+topo()+
      '<div class="abs" style="left:60px;right:60px;top:230px;text-align:center"><h2 style="font-size:96px">O QUE VEM <span class="ouro">NO PACOTE</span></h2></div>'+

      '<img class="abs" src="'+HD[D.hero]+'" style="right:-10px;bottom:-10px;height:320px"></div>';

      '<div class="abs" style="left:60px;right:60px;top:430px;display:grid;gap:26px">'+D.passos.map(function(p,k){return '<div class="passo"><b>'+(k+1)+'</b><span>'+p+'</span></div>';}).join('')+'</div>'+

      '<div class="abs" style="left:0;right:0;bottom:200px">'+pauls(380,0)+'</div>'+rodape+'</div>';
  } else if(/^r[234]$/.test(PECA)){
    var j=Number(PECA[1])-2;
    h='<div class="st" style="width:1080px;height:1920px">'+topo()+
      '<div class="abs an" style="left:0;right:0;top:250px;text-align:center;font-size:86px">'+D.reel[j+1]+'</div>'+

</script>
