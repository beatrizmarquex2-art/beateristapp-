<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Cards do Robôterista Paul · teoria musical</title>
<link rel="stylesheet" href="../../css/fonts.css">
<style>
/* Cards do Robôterista Paul: os 150 cartões da Teoria do app em PDF pra imprimir e recortar (produto da Bea). A4 em pé, 9 cartas de 63×88 mm por folha. */
@page{size:210mm 297mm;margin:0}
*{box-sizing:border-box;margin:0}
html,body{background:#fff;color:#162146;font-family:"Hanken Grotesk",system-ui,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pg{width:210mm;height:297mm;position:relative;overflow:hidden;page-break-after:always;break-after:page}
.grade{position:absolute;left:10.5mm;top:16.5mm;display:grid;grid-template-columns:repeat(3,63mm);grid-auto-rows:88mm}
.rodape{position:absolute;left:0;right:0;bottom:5mm;text-align:center;font-size:7.5pt;color:#6b6f80}
.card{width:63mm;height:88mm;border:.2mm dashed #9aa0b5;padding:2.2mm;position:relative}
.in{height:100%;border-radius:3.2mm;border:.7mm solid var(--c);background:#fffdf7;display:flex;flex-direction:column;overflow:hidden;position:relative}
.topo{background:var(--c);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:1.3mm 2.4mm 1.1mm;font:400 8.6pt/1 "Anton",sans-serif;letter-spacing:.04em;text-transform:uppercase}
.topo small{font:800 6.4pt/1 "Hanken Grotesk",sans-serif;letter-spacing:.06em;opacity:.95}
.des{height:31mm;display:flex;align-items:center;justify-content:center;color:var(--c);padding:1.5mm 2mm 0}
.des svg.tf-sym{height:25mm;width:auto;max-width:100%}.des svg.tf-pt{height:29mm}
.tf-fila{display:flex;align-items:center;justify-content:center;gap:1.2mm;width:100%}.tf-fila svg.tf-sym{height:18mm;max-width:46%}.tf-fila svg.tf-pt{height:20mm;max-width:48%}.tf-fila>b{font:800 15pt/1 "Hanken Grotesk",sans-serif}
.tf-big{font:400 32pt/1 "Anton",sans-serif}.tf-big.small{font-size:15pt;letter-spacing:.02em}.tf-big.tf-acid{font:400 34pt/1 "Noto Music","DejaVu Sans",serif}
h3{font:400 14pt/1.05 "Anton",sans-serif;text-transform:uppercase;text-align:center;padding:1mm 2.4mm .6mm;color:#162146;letter-spacing:.01em}
p.tx{font-size:8.7pt;line-height:1.3;text-align:center;padding:0 2.6mm;font-weight:600;color:#262b45}
.pe{margin-top:auto;display:flex;align-items:flex-end;gap:1.4mm;padding:0 2mm 1.4mm}
.pe .selo{width:8.5mm;height:8.5mm;flex:none}
.pe .mm{flex:1;min-width:0;line-height:1.1}
.pe .mm img{height:4.6mm;display:block;margin-bottom:1.3mm}
.pe .mm span{display:block;font:800 5.8pt/1.2 "Hanken Grotesk",sans-serif;color:var(--c);margin-bottom:.3mm}
.pe .mm i{display:block;font-style:normal;font-size:5pt;color:#6b6f80;font-weight:700}
.pe .paul{height:15mm;width:auto;flex:none;margin-bottom:-.6mm}
.num{position:absolute;right:2.2mm;top:9.2mm;font:800 5.6pt/1 "Hanken Grotesk",sans-serif;color:#9aa0b5}
/* capa e páginas de texto */
.capa{background:radial-gradient(120% 60% at 50% 0,#31408a 0,#162146 45%,#0a0f26 100%);color:#fff7e6;display:flex;flex-direction:column;align-items:center;text-align:center;padding:22mm 18mm}
.capa .placa{background:#fffaf0;border-radius:99px;padding:4mm 9mm 4mm 5mm;display:flex;align-items:center;gap:4mm}.capa .placa img:first-child{height:24mm}.capa .placa img:last-child{height:15mm}
.capa{padding:15mm 16mm 14mm}.capa .placa{padding:3mm 8mm 3mm 4mm}.capa .placa img:first-child{height:19mm}.capa .placa img:last-child{height:12mm}
.capa .cards-de{font:400 40pt/1 "Anton",sans-serif;letter-spacing:.12em;margin-top:10mm;color:#fff7e6}
.capa .plate-logo{background:#fffaf0;border-radius:9mm;padding:5mm 9mm;margin-top:3mm;box-shadow:0 1.5mm 0 rgb(0 0 0/.25)}.capa .plate-logo img{height:50mm;display:block}
.capa .selo-am{margin-top:4mm;background:#f2a91b;color:#162146;font:400 20pt/1 "Anton",sans-serif;text-transform:uppercase;letter-spacing:.06em;padding:3mm 9mm 2.4mm;border-radius:99px;transform:rotate(-3deg)}
.capa h2{font:800 15pt/1.25 "Hanken Grotesk",sans-serif;margin-top:4mm}
.capa .pauls{display:flex;align-items:flex-end;justify-content:center;gap:0;margin-top:6mm}.capa .pauls img{height:50mm}.capa .pauls img.heroi{height:86mm;margin:0 -2mm}
.capa .sub-inst{margin-top:4mm;font:400 24pt/1 "Anton",sans-serif;letter-spacing:.3em;color:#f2a91b;text-indent:.3em;text-align:center}
.capa .pauls.trio3 img{height:60mm}.capa .pauls.trio3 img.heroi{height:82mm;margin:0 -3mm}
.verso .in .trio{display:flex;align-items:flex-end;justify-content:center}.verso .in .trio img{height:18mm;margin:0 -1.5mm}
.des svg.tf-grade{height:auto;width:100%;max-height:27mm}.des svg.tf-diag{height:27mm}
/* baralho dos instrumentos: desenhos largos (teclado, braço, grade) ficam abaixo do número da carta */
body.dict .des{padding-top:4.4mm;height:27mm}body.dict .des svg.tf-sym{height:20mm}body.dict .des svg.tf-pt{height:22mm}body.dict .des svg.tf-diag{height:21mm}body.dict .des svg.tf-grade{max-height:21mm}body.dict h3{font-size:13pt}
body.dict p.en{margin:0;text-align:center;font:italic 700 7pt/1.1 "Hanken Grotesk",sans-serif;color:#6b6f80;padding:0 2.4mm .4mm}body.dict p.tx{font-size:7.7pt;line-height:1.26}
body.dict p.dica{margin:1.2mm 2.4mm 0;padding:1mm 1.8mm;border-radius:1.6mm;background:color-mix(in srgb,var(--c) 11%,#fff);font-size:6.9pt;line-height:1.24;font-weight:600;color:#262b45}body.dict p.dica b{color:var(--c);font-weight:800}
body.deck .des{padding-top:4.4mm}body.deck .des svg.tf-sym{height:21mm}body.deck .des svg.tf-pt{height:24mm}body.deck .des svg.tf-diag{height:23mm}body.deck .des svg.tf-grade{max-height:22mm}body.deck .tf-fila svg.tf-sym{height:16mm}
.capa .temas{display:flex;flex-wrap:wrap;gap:2.5mm;justify-content:center;margin:6mm 0 6mm}.capa .temas span{font:400 11pt/1 "Anton",sans-serif;text-transform:uppercase;letter-spacing:.05em;padding:2.4mm 4.5mm 2mm;border-radius:99px;color:#fff}
.capa .site{margin-top:auto;background:#c81e2d;color:#fff;font:400 22pt/1 "Anton",sans-serif;padding:4mm 10mm 3.4mm;border-radius:99px}
.capa .autora{margin-top:4mm;font:700 10.5pt/1.3 "Hanken Grotesk",sans-serif;opacity:.9}
.txt .logo-topo img{height:17mm;display:block}
.txt{padding:13mm 20mm 12mm;display:flex;flex-direction:column;gap:3.6mm}
.txt h1{font:400 30pt/1 "Anton",sans-serif;text-transform:uppercase;color:#162146}.txt h1 b{color:#c81e2d;font-weight:400}
.txt h4{font:400 15pt/1 "Anton",sans-serif;text-transform:uppercase;color:#c81e2d;margin-top:3mm;letter-spacing:.03em}
.txt p,.txt li{font-size:11pt;line-height:1.4;font-weight:600}.txt ul{padding-left:6mm;display:grid;gap:1.6mm}
.txt .lista{display:grid;grid-template-columns:1fr 1fr;gap:3mm 8mm}.txt .lista div{border-left:2mm solid var(--c);padding-left:3mm}.txt .lista b{font:400 13pt/1.1 "Anton",sans-serif;text-transform:uppercase;display:block}.txt .lista small{font-size:9.5pt;font-weight:600;line-height:1.35;display:block}
.txt .fim{margin-top:auto;display:flex;align-items:center;gap:6mm;border-top:.5mm solid #162146;padding-top:5mm}.txt .fim img{height:27mm}.txt .fim small{font-size:8.6pt;line-height:1.4;font-weight:600;color:#3b3f55}
/* verso */
.verso .card .in{background:radial-gradient(120% 70% at 50% 0,#31408a 0,#162146 55%,#0a0f26 100%);border-color:#f2a91b;align-items:center;justify-content:center;gap:2mm;color:#fff7e6}
.verso .in img.p{height:40mm}.verso .in .lg{background:#fffaf0;border-radius:3mm;padding:1.6mm 3mm}.verso .in .lg img{height:12mm;display:block}.verso .in b{font:400 11pt/1.1 "Anton",sans-serif;text-transform:uppercase;text-align:center}.verso .in b i{font-style:normal;color:#f2a91b}.verso .in small{font:800 6.6pt/1.2 "Hanken Grotesk",sans-serif;letter-spacing:.04em}
</style>
</head>
<body>
<script type="module">
import { FASES_FIGURAS } from '../../js/kids/teoria-figuras.js';
import { FASES_PAUSAS, FASES_CLAVES, FASES_TEMPO, FASES_LEITURA } from '../../js/kids/teoria-temas.js';
import { FASES_BATERIA, FASES_TECLADO, FASES_VIOLAO } from '../../js/kids/teoria-instrumentos.js';
import { gruposDoDicionario } from '../../js/kids/dicionario-cards.js';
// o que vai impresso em toda carta (trocar aqui e gerar de novo)
const QS = new URLSearchParams(location.search); const AUTORA = QS.get('autora') || 'prof. Bea · Beatriz Marques';
const AMOSTRA = Number(QS.get('amostra')) || 0; // ?amostra=3 = PDF de amostra com as 3 primeiras cartas de cada tema
const DICT = QS.get('deck') === 'dicionario'; // ?deck=dicionario = baralho do DICIONÁRIO MUSICAL (um card por termo)
const DECK = QS.get('deck') === 'instrumentos'; // ?deck=instrumentos = baralho dos INSTRUMENTOS (90 cartas: bateria, teclado, violão); sem isso = baralho de TEORIA (150)
const SITE = 'jogos.beaterista.com.br'; const A = '../../assets/';
const LOGO = `${A}originals/logo-roboterista-paul-alta.png`; // logo "Robôterista Paul" (mandado pela Bea)
const PAUL_QUADRO = `${A}originals/paul-professor-quadro-hd.png`; // Paul ensinando no quadro, em alta (mandado pela Bea)
const TEMAS_INST = [
  ['Bateria', 'peças, levada e partitura', '#8e1b22', FASES_BATERIA, 'bateria'],
  ['Teclado', 'teclas, escala e acordes', '#17365B', FASES_TECLADO, 'teclado'],
  ['Violão', 'cordas, acordes e batida', '#b57a12', FASES_VIOLAO, 'guitarra'],
];
const TEMAS_TEORIA = [
  ['Figuras', 'quanto dura cada som', '#c81e2d', FASES_FIGURAS, 'bateria'],
  ['Pausas', 'o silêncio também conta', '#17365B', FASES_PAUSAS, 'ouvindo'],
  ['Claves', 'a chave que abre a pauta', '#b57a12', FASES_CLAVES, 'lendo-partitura'],
  ['Tempo e compasso', 'o pulso e a fórmula', '#1f7f73', FASES_TEMPO, 'metronomo'],
  ['Leitura de notas', 'os nomes das notas', '#6a35c9', FASES_LEITURA, 'teclado'],
];
document.body.classList.toggle('deck', DECK); document.body.classList.toggle('dict', DICT); const TEMAS = DICT ? gruposDoDicionario() : DECK ? TEMAS_INST : TEMAS_TEORIA; const UNI = DICT ? 'grupo' : DECK ? 'instrumento' : 'tema'; const UNIS = DICT ? 'grupos' : DECK ? 'instrumentos' : 'temas'; const NUM = DICT ? '4' : DECK ? '3' : '5'; const ASSUNTO = DICT ? 'termos de bateria, teclado, violão e teoria' : DECK ? 'instrumentos: bateria, teclado e violão' : 'teoria musical';
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const HD = { bateria: 'img/paul-bateria-1000.webp', teclado: 'img/paul-teclado-1000.webp', guitarra: 'img/paul-guitarra-1000.webp' }; // os 3 Pauls dos instrumentos, em alta
const paul = (pose) => ((DECK || DICT) && HD[pose]) || `${A}paul/colorido/paul-${pose}.webp`;
const NOMEDECK = DICT ? 'Cards do Robôterista Paul · Dicionário Musical' : DECK ? 'Cards do Robôterista Paul · Instrumentos' : 'Cards do Robôterista Paul';
const cartasDe = (t) => t[3].reduce((m, f) => m + f.cards.length, 0); // quantas cartas tem cada grupo (30 nos outros baralhos)
const total = TEMAS.reduce((n, t) => n + t[3].reduce((m, f) => m + f.cards.length, 0), 0); const naAmostra = AMOSTRA * TEMAS.length;

// capa
document.body.append(el('section', 'pg capa', `<div class="placa"><img src="${A}logo-512.png" alt=""><img src="${A}logo-nome.png" alt=""></div>
  <div class="cards-de">CARDS DO</div><div class="plate-logo"><img src="${LOGO}" alt="Robôterista Paul"></div>${DECK ? '<div class="sub-inst">INSTRUMENTOS</div>' : DICT ? '<div class="sub-inst">DICIONÁRIO MUSICAL</div>' : ''}${AMOSTRA ? '<div class="selo-am">amostra grátis</div>' : ''}
  <h2>${AMOSTRA ? `${naAmostra} das ${total} cartas de ${ASSUNTO} pra você experimentar` : `${total} cartas de ${ASSUNTO} pra aprender brincando`}</h2>
  ${DICT ? `<div class="pauls"><img src="${paul('lendo-partitura')}" alt=""><img class="heroi" src="${PAUL_QUADRO}" alt="Paul ensinando no quadro"><img src="${paul('ouvindo')}" alt=""></div>` : DECK ? `<div class="pauls trio3"><img src="${paul('guitarra')}" alt="Paul tocando guitarra"><img class="heroi" src="${paul('teclado')}" alt="Paul tocando teclado"><img src="${paul('bateria')}" alt="Paul tocando bateria"></div>` : `<div class="pauls"><img src="${paul('lendo-partitura')}" alt=""><img class="heroi" src="${PAUL_QUADRO}" alt="Paul ensinando no quadro"><img src="${paul('bateria')}" alt=""></div>`}
  <div class="temas">${TEMAS.map(([n, , c]) => `<span style="background:${c}">${n}</span>`).join('')}</div>
  <div class="site">${SITE}</div><p class="autora">criado por ${AUTORA} · Beaterista escola de música</p>`));
// como usar
document.body.append(el('section', 'pg txt', `<div class="logo-topo"><img src="${LOGO}" alt="Robôterista Paul"></div><h1>como usar os <b>cards</b></h1>
  <p>${DICT ? (AMOSTRA ? `Esta amostra traz ${naAmostra} cartas: os ${AMOSTRA} primeiros termos de cada grupo. O baralho completo tem ${total} termos, de bateria, teclado, violão e teoria.` : `São ${total} termos, de bateria, teclado, violão e teoria.`) + ' Cada carta explica uma palavra da música, com o desenho, uma explicação curta e uma dica, do jeito que o Robôterista Paul ensina no app.' : `${AMOSTRA ? `Esta amostra traz ${naAmostra} cartas: as ${AMOSTRA} primeiras de cada ${UNI}. O baralho completo tem ${total}, em ${NUM} ${UNIS} de 30.` : `São ${total} cartas, em ${NUM} ${UNIS} de 30.`} Cada carta ensina uma coisinha só, com o desenho de verdade e uma explicação curta, do jeito que o Robôterista Paul ensina no app.`}</p>
  <h4>pra montar</h4><ul><li>imprima em papel mais grosso (180 g ou mais), em A4, sem "ajustar à página".</li><li>recorte na linha tracejada: cada carta tem 63 × 88 mm, o tamanho de carta de baralho.</li><li>se quiser verso, imprima a última página no lado de trás das folhas.</li></ul>
${DICT ? `  <h4>5 jeitos de brincar</h4><ul><li><b>uma por dia:</b> a criança lê um termo e inventa uma frase com ele.</li><li><b>qual é a palavra?</b> você lê a explicação e ela adivinha o termo.</li><li><b>mostra no instrumento:</b> depois de ler, toque ou bata o que a carta explica.</li><li><b>vale ouvir:</b> procure uma música que use o termo e conte quando ele aparece.</li><li><b>professor por um minuto:</b> ela explica o termo pra alguém da família.</li></ul>
` : DECK ? `  <h4>5 jeitos de brincar</h4><ul><li><b>uma por dia:</b> a criança tira uma carta, lê e mostra no instrumento.</li><li><b>lê e toca:</b> depois de ler, toque o que a carta ensina, bem devagar.</li><li><b>qual é a carta?</b> você lê a explicação e ela diz o nome.</li><li><b>em ordem:</b> embaralhe uma fase (5 cartas) e peça pra pôr na sequência.</li><li><b>professor por um minuto:</b> ela ensina a carta pra alguém da família.</li></ul>
` : `  <h4>5 jeitos de brincar</h4><ul><li><b>uma por dia:</b> a criança tira uma carta, lê e explica com as palavras dela.</li><li><b>professor por um minuto:</b> ela ensina a carta pra alguém da família.</li><li><b>qual é a carta?</b> você lê a explicação e ela diz o nome.</li><li><b>em ordem:</b> embaralhe uma fase (5 cartas) e peça pra pôr na sequência.</li><li><b>bate e fala:</b> nas cartas de ritmo, bata palma no que está escrito.</li></ul>`}
  <h4>${DICT ? 'os 4 grupos' : DECK ? 'os 3 instrumentos' : 'os 5 temas'}</h4><div class="lista">${TEMAS.map(([n, s, c, fs]) => `<div style="--c:${c}"><b style="color:${c}">${n}${DICT ? ` · ${fs.reduce((m, f) => m + f.cards.length, 0)} termos` : ''}</b><small>${s}<br>${fs.map((f) => f.nome).join(' · ')}</small></div>`).join('')}</div>
  <div class="fim"><img src="${DECK ? paul('teclado') : PAUL_QUADRO}" alt=""><small><b>Quer ouvir cada carta e ganhar estrelas?</b><br>No app, toda carta toca o som e cada fase tem um mini quiz: <b>${SITE}</b><br><br>© Beaterista escola de música · ${AUTORA}. Todos os direitos reservados. Material de uso pessoal e em sala de aula por quem comprou; proibida a revenda e a distribuição. @beaterista_</small></div>`));
// cartas, 9 por folha
const cartas = [];
TEMAS.forEach(([nome, , cor, fases, pose]) => { let n = 0; const de = fases.reduce((m, f) => m + f.cards.length, 0); fases.forEach((f, fi) => f.cards.forEach((c) => { n++; if (!AMOSTRA || n <= AMOSTRA) cartas.push({ nome, cor, pose, fase: fi + 1, faseNome: f.nome, n, de, c }); })); });
for (let i = 0; i < cartas.length; i += 9) {
  const pg = el('section', 'pg'); const g = el('div', 'grade');
  cartas.slice(i, i + 9).forEach((k) => {
    const card = el('div', 'card'); card.style.setProperty('--c', k.cor); const inn = el('div', 'in');
    inn.append(el('div', 'topo', `<span>${k.nome}</span><small>${DICT ? k.faseNome : `fase ${k.fase} · ${k.faseNome}`}</small>`));
    const des = el('div', 'des'); try { des.append(k.c.ic()); } catch (e) { des.textContent = '♪'; } inn.append(des);
    inn.append(el('h3', '', k.c.t), ...(DICT && k.c.en ? [el('p', 'en', k.c.en)] : []), el('p', 'tx', k.c.txt), ...(DICT && k.c.dica ? [el('p', 'dica', `<b>dica:</b> ${k.c.dica}`)] : []));
    inn.append(el('div', 'pe', `<img class="selo" src="${A}logo-512.png" alt=""><div class="mm"><img src="${A}logo-nome.png" alt=""><span>${SITE}</span><i>${AUTORA}</i></div><img class="paul" src="${paul(k.pose)}" alt="">`));
    inn.append(el('span', 'num', `${String(k.n).padStart(2, '0')}/${String(k.de).padStart(2, '0')}`));
    card.append(inn); g.append(card);
  });
  pg.append(g, el('p', 'rodape', `${NOMEDECK} · ${SITE} · © Beaterista escola de música · ${AUTORA}`)); document.body.append(pg);
}
// amostra: no lugar do verso, a página que mostra o que tem no completo
if (AMOSTRA) document.body.append(el('section', 'pg txt', `<div class="logo-topo"><img src="${LOGO}" alt="Robôterista Paul"></div><h1>gostou? o completo tem <b>${total} cartas</b></h1>
  <p>Você viu ${naAmostra}. No baralho completo dos ${NOMEDECK} ${DICT ? 'os termos estão organizados em 4 grupos:' : `cada ${UNI} tem 30 cartas, em 6 fases que vão do mais fácil ao mais desafiador:`}</p>
  <div class="lista" style="grid-template-columns:1fr">${TEMAS.map(([n, s2, c, fs]) => `<div style="--c:${c}"><b style="color:${c}">${n} · ${fs.reduce((m, f) => m + f.cards.length, 0)} ${DICT ? 'termos' : 'cartas'}</b><small>${s2}: ${fs.map((f) => f.nome).join(' · ')}</small></div>`).join('')}</div>
  <h4>como conseguir o completo</h4><p>Fale com a ${AUTORA.split(' · ')[0]} no Instagram <b>@beaterista_</b> ou entre em <b>${SITE}</b>, na Lojinha.</p>
  <div class="fim"><img src="${DECK ? paul('teclado') : PAUL_QUADRO}" alt=""><small><b>E no app tem mais:</b> toda carta toca o som, cada fase tem um mini quiz e a criança ganha estrelas e figurinhas.<br><b>${SITE}</b><br><br>© Beaterista escola de música · ${AUTORA}. Amostra de distribuição livre; proibida a venda.</small></div>`));
else { const pg = el('section', 'pg verso'); const g = el('div', 'grade'); for (let i = 0; i < 9; i++) { const card = el('div', 'card'); card.append(el('div', 'in', `${DECK ? `<div class="trio"><img src="${paul('guitarra')}" alt=""><img src="${paul('teclado')}" alt=""><img src="${paul('bateria')}" alt=""></div>` : `<img class="p" src="${PAUL_QUADRO}" alt="">`}<div class="lg"><img src="${LOGO}" alt=""></div><b>Cards do <i>Robôterista Paul</i></b><small>${DECK ? 'INSTRUMENTOS · ' : DICT ? 'DICIONÁRIO MUSICAL · ' : ''}${SITE}</small>`)); g.append(card); } pg.append(g, el('p', 'rodape', 'verso das cartas (opcional): imprima esta página atrás de cada folha')); document.body.append(pg); }
await Promise.all([...document.images].map((im) => (im.complete ? 0 : new Promise((ok) => { im.onload = im.onerror = ok; }))));
await document.fonts.ready; window.__pronto = { cartas: cartas.length, paginas: document.querySelectorAll('.pg').length };
</script>
