<html lang="pt-BR"><head><meta charset="utf-8"><title>Dicionário Musical · 3 modelos de carta</title>

<style>
@page{size:210mm 297mm;margin:0}*{box-sizing:border-box;margin:0}
html,body{background:#fff;font-family:"Hanken Grotesk",system-ui,sans-serif;color:#162146;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pg{width:210mm;height:297mm;position:relative;overflow:hidden;page-break-after:always}
.pg h2{position:absolute;left:10.5mm;top:6mm;font:400 12pt/1 Anton,sans-serif;letter-spacing:.05em;text-transform:uppercase;color:#162146}
.grade{position:absolute;left:10.5mm;top:16.5mm;display:grid;grid-template-columns:repeat(3,63mm);grid-auto-rows:88mm}

.k{width:100%;height:100%;position:relative;overflow:hidden;display:flex;flex-direction:column}
.k svg.ic{stroke:currentColor;fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.k .rod{display:flex;align-items:center;gap:1.4mm}.k .rod img.n{height:4.4mm}.k .rod small{white-space:nowrap;font:800 5.2pt/1.15 "Hanken Grotesk";letter-spacing:.03em}
/* ===== A · ingresso ===== */
.A{background:#fff6dc;border-radius:3mm;color:#162146;border:.6mm solid var(--c)}
.A .faixa{background:var(--c);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:1.5mm 3mm;font:400 7.4pt/1 Anton;letter-spacing:.08em;text-transform:uppercase}
.A .faixa small{font:800 5.6pt/1 "Hanken Grotesk";letter-spacing:.1em}
.A .selo{width:21mm;height:21mm;border-radius:50%;border:.7mm dashed var(--c);color:var(--c);margin:2.6mm auto 1.2mm;display:flex;align-items:center;justify-content:center;background:#fff}.A .selo svg{width:14mm;height:14mm}
.A h3{font:400 16pt/1 Anton;text-transform:uppercase;text-align:center;letter-spacing:.01em}
.A .en{text-align:center;font:italic 700 6.6pt/1.2 "Hanken Grotesk";color:var(--c);margin:.6mm 0 1.4mm}
.A .tx{font:600 7.9pt/1.3 "Hanken Grotesk";text-align:center;padding:0 3mm}
.A .ex{margin:1.6mm 3mm 0;padding:1mm 2mm;border-left:.9mm solid var(--c);background:rgba(0,0,0,.05);font:700 7pt/1.25 "Hanken Grotesk"}
.A .corte{position:absolute;left:0;right:0;bottom:14mm;border-top:.5mm dashed var(--c)}
.A .corte:before,.A .corte:after{content:"";position:absolute;top:-2.2mm;width:4.4mm;height:4.4mm;border-radius:50%;background:#fff;border:.6mm solid var(--c)}.A .corte:before{left:-2.8mm}.A .corte:after{right:-2.8mm}
.A .canhoto{margin-top:auto;height:14mm;display:flex;align-items:center;gap:2mm;padding:0 3mm}
.A .canhoto .bar{flex:none;width:17mm;height:8mm;background:repeating-linear-gradient(90deg,#162146 0 .35mm,transparent .35mm .8mm,#162146 .8mm 1.5mm,transparent 1.5mm 1.9mm)}
.A .canhoto img.p{height:11mm;margin-left:auto}
/* ===== B · zine ===== */
.B{background:#fff;border:.7mm solid #162146;border-radius:2mm;box-shadow:1.4mm 1.4mm 0 var(--c);color:#162146;margin:0 1.4mm 1.4mm 0;width:calc(100% - 1.4mm);height:calc(100% - 1.4mm)}
.B .tape{position:absolute;width:13mm;height:4.2mm;background:rgba(242,169,27,.85);top:-1.4mm;transform:rotate(-8deg);left:3mm}.B .tape.d{left:auto;right:3mm;transform:rotate(7deg)}
.B .cat{margin:4mm 3mm 0;align-self:flex-start;background:var(--c);color:#fff;font:400 7pt/1 Anton;letter-spacing:.08em;text-transform:uppercase;padding:.9mm 2mm;border-radius:99mm}
.B .ilu{height:25mm;margin:1.6mm 3mm 0;border-radius:2mm;background:radial-gradient(circle,var(--c) .35mm,transparent .4mm) 0 0/2mm 2mm,#fff;border:.4mm solid #162146;color:#162146;display:flex;align-items:center;justify-content:center}.B .ilu svg{width:19mm;height:19mm;background:#fff;border-radius:50%;padding:1.4mm;border:.4mm solid #162146}
.B h3{font:400 16.5pt/1 Anton;text-transform:uppercase;margin:2mm 3mm 0;display:inline-block;align-self:flex-start;background:linear-gradient(transparent 55%,#f2a91b 55%)}
.B .en{margin:.6mm 3mm 0;font:800 6.5pt/1 "Hanken Grotesk";color:var(--c)}
.B .tx{margin:1.3mm 3mm 0;font:600 7.9pt/1.3 "Hanken Grotesk"}
.B .ex{margin:auto 17mm 8mm 3mm;padding:1.1mm 2mm;border:.4mm solid #162146;border-radius:2mm 2mm 2mm 0;font:700 6.9pt/1.25 "Hanken Grotesk";background:#fff6dc;position:relative}
.B img.p{position:absolute;right:1mm;bottom:5mm;height:17mm}
.B .rod{position:absolute;left:3mm;right:3mm;bottom:1.8mm}
/* ===== C · palco ===== */
.C{background:radial-gradient(120% 70% at 50% 0,#3a4aa0 0,#162146 52%,#0a0f26 100%);color:#fff7e6;border-radius:3mm;border:.6mm solid var(--c)}
.C:before{content:"";position:absolute;left:50%;top:-2mm;width:46mm;height:46mm;margin-left:-23mm;background:conic-gradient(from 160deg at 50% 0,transparent 0 0deg,rgba(255,236,170,.10) 0 40deg,transparent 40deg);}
.C .cat{position:relative;margin:2.6mm 0 0;text-align:center;font:800 6pt/1 "Hanken Grotesk";letter-spacing:.2em;text-transform:uppercase;color:var(--c2)}
.C .ilu{position:relative;margin:2mm auto 0;width:24mm;height:24mm;color:#fff7e6;display:flex;align-items:center;justify-content:center;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.14),transparent 70%);box-shadow:0 0 0 .5mm var(--c)}.C .ilu svg{width:17mm;height:17mm}
.C h3{position:relative;font:400 16.5pt/1 Anton;text-transform:uppercase;text-align:center;margin-top:2mm;color:#fff7e6;text-shadow:0 0 3mm var(--c)}
.C .en{position:relative;text-align:center;font:italic 700 6.6pt/1.2 "Hanken Grotesk";color:var(--c2);margin:.5mm 0 1.4mm}
.C .tx{position:relative;font:600 7.7pt/1.3 "Hanken Grotesk";text-align:center;padding:0 3mm;color:#f1ead8}
.C .ex{position:relative;margin:1.8mm 3mm 0;padding:1.1mm 2mm;background:#fff6dc;color:#162146;border-radius:1.4mm;font:700 6.9pt/1.25 "Hanken Grotesk";transform:rotate(-1.2deg)}
.C .rod{position:absolute;left:3mm;bottom:2mm;color:#f1ead8}.C .rod img.n{filter:brightness(0) invert(1)}.C img.p{position:absolute;right:1.5mm;bottom:1mm;height:15mm}

/* ===== D · pauta (pouca tinta: só linhas finas e um acento) ===== */
.D{background:#fff;border:.4mm solid #162146;border-radius:3mm;color:#162146}
.D .top{display:flex;justify-content:space-between;padding:2.4mm 3mm 0;font:800 5.8pt/1 "Hanken Grotesk";letter-spacing:.14em;text-transform:uppercase;color:var(--c)}.D .top span+span{color:#162146;opacity:.55}
.D .pauta{position:relative;height:23mm;margin-top:1mm;display:flex;align-items:center;justify-content:center}
.D .pauta:before{content:"";position:absolute;left:0;right:0;top:3.2mm;height:16.4mm;background:repeating-linear-gradient(#9aa2bb 0 .3mm,transparent .3mm 4.1mm);background-size:100% 16.7mm}
.D .bola{position:relative;width:19mm;height:19mm;border-radius:50%;background:#fff;border:.4mm solid #162146;display:flex;align-items:center;justify-content:center}.D .bola svg{width:12.5mm;height:12.5mm}
.D h3{font:400 16pt/1 Anton;text-transform:uppercase;text-align:center}
.D .en{text-align:center;font:700 6.4pt/1.2 "Hanken Grotesk";color:var(--c);margin:.7mm 0 1.4mm;letter-spacing:.04em}
.D .tx{font:600 7.9pt/1.3 "Hanken Grotesk";text-align:center;padding:0 3.2mm}
.D .ex{margin:2mm 3.2mm 0;padding-top:1.5mm;border-top:.3mm dashed #9aa2bb;font:700 7pt/1.25 "Hanken Grotesk";text-align:center}
.D .rod{margin-top:auto;padding:0 3mm 2.2mm;justify-content:space-between}.D img.p{position:absolute;right:1.5mm;bottom:1.2mm;height:22mm;width:auto}.D .rod .rod{flex-direction:column;align-items:flex-start;gap:.6mm}.D .rod{align-items:flex-end}
/* ===== E · vinil ===== */
.E{background:#fff;border:.4mm solid #162146;border-radius:3mm;color:#162146}
.E .cat{margin-top:2.4mm;text-align:center;font:800 5.8pt/1 "Hanken Grotesk";letter-spacing:.16em;text-transform:uppercase;color:var(--c)}
.E .disco{width:31mm;height:31mm;margin:2mm auto 0;border-radius:50%;border:.4mm solid #162146;background:repeating-radial-gradient(circle,#fff 0 .6mm,#c9cedd .6mm .78mm);display:flex;align-items:center;justify-content:center}
.E .miolo{width:15mm;height:15mm;border-radius:50%;background:#fff;border:.4mm solid var(--c);color:#162146;display:flex;align-items:center;justify-content:center;position:relative}.E .miolo svg{width:10mm;height:10mm}.E .miolo:after{content:"";position:absolute;width:1.6mm;height:1.6mm;border-radius:50%;background:#fff;border:.3mm solid #162146;bottom:-.8mm;display:none}
.E h3{margin-top:2.2mm;font:400 16pt/1 Anton;text-transform:uppercase;text-align:center}
.E .en{text-align:center;font:700 6.4pt/1.2 "Hanken Grotesk";color:var(--c);margin:.6mm 0 1.2mm}
.E .tx{font:600 7.8pt/1.3 "Hanken Grotesk";text-align:center;padding:0 3.2mm}
.E .ex{margin:1.6mm 3.2mm 0;text-align:center;font:700 7pt/1.25 "Hanken Grotesk"}.E .ex:before{content:"\266A  ";color:var(--c)}
.E .rod{margin-top:auto;padding:0 3mm 2.2mm;justify-content:space-between}.E img.p{height:9mm}
/* ===== F · ficha de biblioteca ===== */
.F{background:#fff;border:.4mm solid #162146;border-radius:1.6mm;color:#162146;
  background-image:repeating-linear-gradient(transparent 0 4.5mm,#aac7e6 4.5mm 4.75mm);background-position:0 11.5mm;background-size:100% 100%}
.F:before{content:"";position:absolute;left:0;right:0;top:9.2mm;border-top:.35mm solid #e4868c}.F:after{content:"";position:absolute;top:0;bottom:0;left:7mm;border-left:.35mm solid #e4868c}
.F .top{position:relative;z-index:1;height:9mm;display:flex;justify-content:space-between;align-items:center;padding:0 3mm 0 9mm;font:800 5.8pt/1 "Hanken Grotesk";letter-spacing:.14em;text-transform:uppercase;color:var(--c)}.F .top span+span{color:#162146;opacity:.55}
.F .cab{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;padding:0 3mm 0 9mm;height:14.5mm}
.F h3{font:400 15.5pt/1 Anton;text-transform:uppercase}.F .cab svg{width:11mm;height:11mm;color:var(--c);background:#fff;border-radius:50%}
.F .en{position:relative;z-index:1;padding:0 3mm 0 9mm;font:italic 700 6.4pt/4.5mm "Hanken Grotesk";color:var(--c)}
.F .tx{position:relative;z-index:1;padding:0 3mm 0 9mm;font:600 7.7pt/4.5mm "Hanken Grotesk"}
.F .ex{position:relative;z-index:1;margin:0 3mm 0 9mm;font:700 7.1pt/4.5mm "Hanken Grotesk"}
.F .rod{position:absolute;left:9mm;right:3mm;bottom:1.6mm;justify-content:space-between}.F .rod span{display:flex;align-items:center;gap:1.4mm}.F img.p{height:9mm;background:#fff;border-radius:2mm}
</style></head><body><div id="r"></div>
