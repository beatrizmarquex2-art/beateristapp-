<title>Agenda do Paul</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* conceito: agenda de bolso, semana por semana, a próxima postagem sempre no topo */
:root{
  --bg:#f7f5f2; --surface:#ffffff; --ink:#1b1820; --muted:#6c6672; --line:#e4dfe0;
  --red:#d92b35; --red-soft:#fde8e9; --yellow:#f4c21b; --yellow-soft:#fff4c9;
  --bea:#7a3fc4; --bea-soft:#efe5fb; --tik:#1b1820; --tik-soft:#e9e7ea; --story:#c9791a; --story-soft:#fdeed9;
  --ok:#1f8a4c; --ok-soft:#dff3e7; --warn:#b4540a; --warn-soft:#ffe9d5;
  --display:'Gochi Hand','Comic Sans MS',cursive; --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141218; --surface:#1f1c25; --ink:#f3f0f5; --muted:#a29cab; --line:#34303c;
  --red:#ff5a63; --red-soft:#3a1f24; --yellow:#f4c21b; --yellow-soft:#3b3316;
  --bea:#b891f2; --bea-soft:#2d2140; --tik:#f3f0f5; --tik-soft:#2b2832; --story:#f0a34a; --story-soft:#3a2b17;
  --ok:#55c985; --ok-soft:#183324; --warn:#f0a063; --warn-soft:#3b2615; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141218; --surface:#1f1c25; --ink:#f3f0f5; --muted:#a29cab; --line:#34303c;
  --red:#ff5a63; --red-soft:#3a1f24; --yellow:#f4c21b; --yellow-soft:#3b3316;
  --bea:#b891f2; --bea-soft:#2d2140; --tik:#f3f0f5; --tik-soft:#2b2832; --story:#f0a34a; --story-soft:#3a2b17;
  --ok:#55c985; --ok-soft:#183324; --warn:#f0a063; --warn-soft:#3b2615; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);
  padding-block:0 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
header{padding-top:28px;display:flex;flex-direction:column;gap:6px}
h1{font:400 clamp(2.2rem,7vw,3.4rem)/1 var(--display);margin:0;color:var(--red);letter-spacing:.01em}
.sub{color:var(--muted);margin:0;max-width:60ch}
.stats{display:flex;gap:8px 20px;flex-wrap:wrap;margin:14px 0 0;padding:0;list-style:none;font-variant-numeric:tabular-nums}
.stats li{font-size:.85rem;color:var(--muted)}.stats b{color:var(--ink);font-size:1.15rem;margin-right:4px}
.barra{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0;margin-top:12px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.85rem;font-weight:600;min-height:36px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.proxima{margin-top:20px;background:var(--yellow-soft);border:2px solid var(--yellow);border-radius:14px;padding:16px;display:grid;gap:6px}
.proxima .rot{font:400 1.3rem var(--display);color:var(--ink)}
.proxima p{margin:0}
.semana{margin-top:34px}
.semana h2{font:400 1.7rem/1.1 var(--display);margin:0;color:var(--ink)}
.semana .fase{color:var(--muted);font-size:.85rem;margin:2px 0 12px}
.dias{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:760px){.dias{grid-template-columns:1fr 1fr}}
.dia{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.dia.hoje{border:2px solid var(--yellow);box-shadow:0 0 0 3px var(--yellow-soft)}
.dia h3{margin:0 0 8px;font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.marco{background:var(--red-soft);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:.85rem;font-weight:600;margin-bottom:8px}
.item{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 0;min-width:0}
.item:first-of-type{border-top:0}
.th{width:44px;height:64px;border-radius:7px;background:var(--tik-soft);object-fit:cover;display:block}
.th.vazio{display:grid;place-items:center;font-size:.7rem;color:var(--muted);text-align:center;padding:2px}
.item .t{min-width:0}
.item .t b{display:block;font-weight:600;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tag{border-radius:999px;padding:1px 9px;font-weight:700;font-size:.72rem}
.tag.paul{background:var(--red-soft);color:var(--red)}.tag.bea{background:var(--bea-soft);color:var(--bea)}
.tag.tiktok{background:var(--tik-soft);color:var(--tik)}.tag.story{background:var(--story-soft);color:var(--story)}.tag.tarefa{background:var(--tik-soft);color:var(--muted)}
.estado{font-size:.72rem;font-weight:700;border-radius:6px;padding:2px 7px;white-space:nowrap}
.estado.ok{background:var(--ok-soft);color:var(--ok)}.estado.atencao{background:var(--warn-soft);color:var(--warn)}
.item.vago .t b{color:var(--warn)}
.item.feito .t b{text-decoration:line-through;color:var(--muted)}
.secao{margin-top:44px}
.secao h2{font:400 1.7rem var(--display);margin:0 0 8px}
.secao ul{margin:0;padding-left:20px;display:grid;gap:6px}
.secao li span{color:var(--muted)}
.fases{display:grid;gap:8px}
.fase-linha{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:baseline;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.fase-linha b{font-variant-numeric:tabular-nums}
.baixar{display:inline-block;background:var(--red);color:#fff;padding:10px 16px;border-radius:10px;font-weight:700;text-decoration:none;margin:4px 0}
.folha{position:fixed;inset:0;z-index:20;background:rgba(10,8,14,.55);display:flex;align-items:flex-end;justify-content:center}
.folha[hidden]{display:none}
.cartao{background:var(--surface);color:var(--ink);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
@media(min-width:700px){.folha{align-items:center}.cartao{border-radius:18px}}
.cartao h2{font:400 1.7rem/1.1 var(--display);margin:0}
.topo{display:flex;gap:14px;align-items:flex-start}
.topo img,.topo .th{width:96px;height:auto;aspect-ratio:9/16;border-radius:10px;object-fit:cover;flex:none}
.leg{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:.92rem;overflow-wrap:anywhere;margin:0;font-family:var(--body)}
.acoes{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;background:var(--red);color:#fff;min-height:44px}
.btn.sec{background:var(--tik-soft);color:var(--ink)}
.btn.feito{background:var(--ok);color:#fff}
.aviso{background:var(--warn-soft);color:var(--ink);border-left:4px solid var(--warn);padding:8px 12px;border-radius:6px;font-size:.88rem}
.arqs{font-size:.8rem;color:var(--muted);overflow-wrap:anywhere}
@media (prefers-reduced-motion:no-preference){.cartao{animation:sobe .18s ease-out}@keyframes sobe{from{transform:translateY(24px);opacity:0}}}
</style>

<div class="wrap">
<header>
  <h1>Agenda do Paul</h1>
  <p class="sub" id="sub"></p>
  <ul class="stats" id="stats"></ul>
</header>
<div class="barra" id="filtros" role="group" aria-label="Filtros"></div>
<div id="proxima"></div>
<main id="semanas"></main>
<section class="secao" id="fases"></section>
<section class="secao" id="faltam"></section>
<section class="secao" id="sobra"></section>
<section class="secao" id="fora"></section>
<section class="secao" id="como"></section>
</div>
<div class="folha" id="folha" hidden><div class="cartao" id="cartao" role="dialog" aria-modal="true"></div></div>

<script>
const D = /*DADOS*/null;
const NOMES = {paul:'@jogos.beaterista', bea:'@beaterista_', tiktok:'TikTok', story:'Stories', tarefa:'Tarefa', marco:'Marco'};
const TIPOS = {reel:'reel', carrossel:'carrossel', cartaz:'post', post:'post', story:'story', rotina:'rotina', tarefa:'tarefa', marco:'marco', lacuna:'falta criar'};
let filtro = 'todos', soFalta = false, feitos = {};
try { feitos = JSON.parse(localStorage.getItem('beat-agenda-feitos') || '{}'); } catch (e) {}
const chave = i => i.data + '|' + i.hora + '|' + i.rede + '|' + i.id;
function salvar(){ try { localStorage.setItem('beat-agenda-feitos', JSON.stringify(feitos)); } catch (e) {} }
const dt = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const fmtDia = s => dt(s).toLocaleDateString('pt-BR', {weekday:'long', day:'numeric', month:'long'});
const fmtCurto = s => dt(s).toLocaleDateString('pt-BR', {day:'numeric', month:'short'});
const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function segunda(s){ const d = dt(s); const k = (d.getDay() + 6) % 7; d.setDate(d.getDate() - k); return d.toISOString ? new Date(d.getFullYear(), d.getMonth(), d.getDate()) : d; }
const iso = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');

function visivel(i){
  if (i.tipo === 'marco') return true;
  if (filtro === 'todos') return true;
  if (filtro === 'extras') return ['story','tarefa'].includes(i.rede);
  return i.rede === filtro;
}
function thumb(i){
  const p = D.pecas[i.id];
  if (p && p.thumb) return '<img class="th" loading="lazy" alt="" src="' + esc(p.thumb) + '">';
  const rotulo = i.tipo === 'lacuna' ? 'criar' : i.tipo === 'tarefa' ? 'tarefa' : i.tipo === 'rotina' ? 'story' : (p && p.drive ? 'arte no Drive' : '');
  return '<div class="th vazio">' + rotulo + '</div>';
}
function linha(i){
  const b = el('button', 'item' + (feitos[chave(i)] ? ' feito' : '') + (i.tipo === 'lacuna' ? ' vago' : ''));
  b.type = 'button';
  const est = feitos[chave(i)] ? '<span class="estado ok">postado</span>' : i.status === 'precisa_ok' ? '<span class="estado atencao">conferir</span>' : '';
  b.innerHTML = thumb(i) + '<span class="t"><b>' + esc(i.titulo) + '</b><span class="meta"><span class="tag ' + i.rede + '">' + esc(NOMES[i.rede] || i.rede) + '</span><span>' + i.hora + '</span><span>' + (TIPOS[i.tipo] || i.tipo) + '</span></span></span>' + est;
  b.addEventListener('click', () => abrir(i));
  return b;
}
function semanas(){
  const alvo = document.getElementById('semanas'); alvo.innerHTML = '';
  const hoje = iso(new Date());
  const porSemana = {};
  D.itens.forEach(i => { (porSemana[iso(segunda(i.data))] = porSemana[iso(segunda(i.data))] || []).push(i); });
  Object.keys(porSemana).sort().forEach((sem, n) => {
    const itens = porSemana[sem];
    const s = el('section', 'semana');
    const fase = (itens.find(x => x.fase) || {}).fase || '';
    const ate = new Date(dt(sem)); ate.setDate(ate.getDate() + 6);
    s.appendChild(el('h2', '', 'Semana ' + (n+1) + ' · ' + fmtCurto(sem) + ' a ' + fmtCurto(iso(ate))));
    s.appendChild(el('p', 'fase', esc(fase)));
    const g = el('div', 'dias');
    const dias = [...new Set(itens.map(x => x.data))].sort();
    dias.forEach(dia => {
      const todos = itens.filter(x => x.data === dia);
      const vis = todos.filter(visivel).filter(x => !(soFalta && feitos[chave(x)]));
      if (!vis.some(x => x.tipo !== 'marco')) return;
      const box = el('div', 'dia' + (dia === hoje ? ' hoje' : ''));
      box.appendChild(el('h3', '', '<span>' + fmtDia(dia) + '</span>' + (dia === hoje ? '<span>hoje</span>' : '')));
      vis.filter(x => x.tipo === 'marco').forEach(m => box.appendChild(el('div', 'marco', '📌 ' + esc(m.titulo))));
      vis.filter(x => x.tipo !== 'marco').forEach(x => box.appendChild(linha(x)));
      g.appendChild(box);
    });
    s.appendChild(g); alvo.appendChild(s);
  });
}
function proxima(){
  const alvo = document.getElementById('proxima'); alvo.innerHTML = '';
  const agora = new Date(); const hoje = iso(agora);
  const hh = String(agora.getHours()).padStart(2,'0') + ':' + String(agora.getMinutes()).padStart(2,'0');
  const fila = D.itens.filter(i => ['paul','bea','tiktok'].includes(i.rede) && i.tipo !== 'lacuna' && !feitos[chave(i)] && (i.data > hoje || (i.data === hoje && i.hora >= hh)));
  const c = el('div', 'proxima');
  if (!fila.length){ return; }
  const i = fila[0];
  const antes = i.data > hoje ? (i.data === iso(new Date(agora.getFullYear(), agora.getMonth(), agora.getDate()+1)) ? 'amanhã' : fmtDia(i.data)) : 'hoje';
  c.appendChild(el('div', 'rot', 'a próxima postagem'));
  c.appendChild(el('p', '', '<b>' + esc(i.titulo) + '</b><br>' + antes + ' às ' + i.hora + ' · ' + esc(NOMES[i.rede])));
  const b = el('button', 'btn', 'abrir e copiar a legenda'); b.type = 'button'; b.style.justifySelf = 'start';
  b.addEventListener('click', () => abrir(i)); c.appendChild(b);
  alvo.appendChild(c);
}
function filtros(){
  const alvo = document.getElementById('filtros'); alvo.innerHTML = '';
  [['todos','Tudo'],['paul','Paul'],['bea','Bea'],['tiktok','TikTok'],['extras','Stories e tarefas']].forEach(([k, t]) => {
    const b = el('button', 'chip', t); b.type = 'button'; b.setAttribute('aria-pressed', filtro === k);
    b.addEventListener('click', () => { filtro = k; filtros(); semanas(); }); alvo.appendChild(b);
  });
  const f = el('button', 'chip', 'esconder o que já postei'); f.type = 'button'; f.setAttribute('aria-pressed', soFalta);
  f.addEventListener('click', () => { soFalta = !soFalta; filtros(); semanas(); }); alvo.appendChild(f);
}
function abrir(i){
  const p = D.pecas[i.id] || {};
  const c = document.getElementById('cartao'); c.innerHTML = '';
  const topo = el('div', 'topo');
  topo.innerHTML = (p.thumb ? '<img alt="" src="' + esc(p.thumb) + '">' : '<div class="th vazio">' + (p.drive ? 'arte no Drive' : '') + '</div>') +
    '<div><h2>' + esc(i.titulo) + '</h2><p class="meta" style="margin:6px 0 0"><span class="tag ' + i.rede + '">' + esc(NOMES[i.rede]) + '</span><span>' + fmtDia(i.data) + ', ' + i.hora + '</span></p></div>';
  c.appendChild(topo);
  if (i.status === 'precisa_ok') c.appendChild(el('div', 'aviso', '<b>Precisa do ok da Bea antes de postar.</b> ' + esc(i.obs)));
  else if (i.obs) c.appendChild(el('div', 'aviso', esc(i.obs)));
  const texto = p.legenda_completa || '';
  if (texto){ const pre = el('pre', 'leg'); pre.textContent = texto; pre.id = 'leg'; c.appendChild(pre); }
  else if (i.tipo === 'story') c.appendChild(el('p', '', 'Story sem legenda: coloque a figurinha indicada acima.'));
  const arqs = (p.arquivos || []);
  if (arqs.length) c.appendChild(el('div', 'arqs', 'arquivo' + (arqs.length > 1 ? 's' : '') + ': marketing/prontos/' + esc(arqs.length > 1 ? arqs[0] + ' … ' + arqs[arqs.length-1] : arqs[0])));
  if (p.drive_url) c.appendChild(el('div', 'arqs', 'a arte está no Drive (pasta posts): <a href="' + esc(p.drive_url) + '" target="_blank" rel="noopener">abrir</a>'));
  const ac = el('div', 'acoes');
  if (texto){
    const cp = el('button', 'btn', 'copiar legenda'); cp.type = 'button';
    cp.addEventListener('click', () => {
      const ok = () => { cp.textContent = 'copiada'; setTimeout(() => cp.textContent = 'copiar legenda', 1600); };
      const sel = () => { const r = document.createRange(); r.selectNodeContents(document.getElementById('leg')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); cp.textContent = 'selecionada: copie'; };
      try { navigator.clipboard.writeText(texto).then(ok, sel); } catch (e) { sel(); }
    });
    ac.appendChild(cp);
  }
  const fz = el('button', 'btn sec' + (feitos[chave(i)] ? ' feito' : ''), feitos[chave(i)] ? 'postado ✓' : 'marcar como postado'); fz.type = 'button';
  fz.addEventListener('click', () => { feitos[chave(i)] = !feitos[chave(i)]; if (!feitos[chave(i)]) delete feitos[chave(i)]; salvar(); fechar(); proxima(); semanas(); });
  ac.appendChild(fz);
  const fx = el('button', 'btn sec', 'fechar'); fx.type = 'button'; fx.addEventListener('click', fechar); ac.appendChild(fx);
  c.appendChild(ac);
  document.getElementById('folha').hidden = false;
  fx.focus();
}
function fechar(){ document.getElementById('folha').hidden = true; }
document.getElementById('folha').addEventListener('click', e => { if (e.target.id === 'folha') fechar(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') fechar(); });

function resto(){
  const feed = D.itens.filter(i => ['paul','bea','tiktok'].includes(i.rede) && i.tipo !== 'lacuna');
  document.getElementById('sub').textContent = 'Posts prontos da Beaterista distribuídos de ' + fmtCurto(D.inicio) + ' a ' + fmtCurto(D.ate) + ', com legenda pra copiar. Só planeja: nada é publicado sozinho, e cada peça precisa do ok da Bea.';
  const n = t => feed.filter(i => i.rede === t).length;
  document.getElementById('stats').innerHTML = '<li><b>' + feed.length + '</b>posts</li><li><b>' + n('paul') + '</b>Paul</li><li><b>' + n('bea') + '</b>Bea</li><li><b>' + n('tiktok') + '</b>TikTok</li><li><b>' + D.itens.filter(i => i.rede === 'story').length + '</b>stories</li>';
  document.getElementById('fases').innerHTML = '<h2>Fases da campanha</h2><div class="fases">' + D.fases.map(f => '<div class="fase-linha"><b>' + fmtCurto(f[0]) + ' a ' + fmtCurto(f[1]) + '</b><span><b>' + esc(f[2]) + '.</b> ' + esc(f[3]) + '</span></div>').join('') + '</div>';
  document.getElementById('faltam').innerHTML = '<h2>Peças que faltam</h2><ul>' + D.faltam.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>';
  document.getElementById('sobra').innerHTML = '<h2>Prontas e ainda sem data</h2><p class="sub">Não couberam até ' + fmtCurto(D.ate) + '. Rode a agenda com um prazo maior e elas entram.</p><ul>' + D.sobra.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>';
  document.getElementById('fora').innerHTML = '<h2>Ficaram de fora</h2><ul>' + D.excluidas.map(x => '<li>' + esc(x[0]) + ' <span>— ' + esc(x[1]) + '</span></li>').join('') + '</ul>';
  document.getElementById('como').innerHTML = '<h2>Como usar</h2><ul><li>Toque numa peça: a legenda já vem com as hashtags e o botão copia.</li><li>Marque “postado” e ela some se você esconder o que já fez (isso fica só neste aparelho).</li>' +
    (D.inline ? '<li>Pra receber aviso no celular, peça o arquivo <b>agenda.ics</b> e abra no Google Agenda ou no calendário do iPhone.</li>' : '<li>Pra receber aviso no celular: <a class="baixar" href="agenda.ics">baixar agenda.ics</a> e abrir no Google Agenda ou no calendário do iPhone. Cada evento avisa 30 minutos antes e traz a legenda.</li>') +
    '<li>Pra refazer o calendário depois de incluir peças novas: <code>python3 marketing/calendario/agenda.py</code>.</li></ul>';
}
resto(); filtros(); proxima(); semanas();
</script>
