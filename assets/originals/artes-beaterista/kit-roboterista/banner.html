<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Anton;src:url(img/anton.woff2) format('woff2')}
*{box-sizing:border-box;margin:0}body{width:1800px;height:620px;background:#a8182e;color:#f3eadc;font-family:Anton,Impact,sans-serif;position:relative;overflow:hidden}
.bg{position:absolute;inset:0;background:radial-gradient(circle at 72% 55%,#e0405a66,transparent 55%)}
.dots{position:absolute;left:640px;top:24px;width:260px;height:150px;background:radial-gradient(#f2c14e 2px,transparent 2.5px) 0 0/22px 22px;opacity:.45}
.t{position:absolute;left:70px;top:46px;font:24px ui-monospace,monospace;letter-spacing:.1em}
h1{position:absolute;left:70px;top:84px;font-size:128px;line-height:1.08;font-weight:400;text-transform:uppercase}h1 em{display:block;color:#f2c14e;font-style:normal}
.sub{position:absolute;left:74px;top:350px;font:600 28px system-ui;max-width:600px;line-height:1.25}
.preco{position:absolute;left:70px;bottom:34px;display:flex;align-items:flex-end;gap:20px}
.preco s{font:26px system-ui;opacity:.85;margin-bottom:12px}.preco b{font-size:96px;color:#f2c14e;font-weight:400;line-height:1;white-space:nowrap}
.btn{background:#10234a;padding:16px 26px;border-radius:10px;font:600 26px system-ui;margin-bottom:12px}
.prods{position:absolute;left:730px;top:70px;display:grid;grid-template-columns:repeat(2,170px);gap:14px}
.prods img{width:170px;display:block;border-radius:8px;border:5px solid #fff;box-shadow:0 8px 0 #55101a}
.prods img:nth-child(1){transform:rotate(-3deg)}.prods img:nth-child(2){transform:rotate(2deg)}.prods img:nth-child(3){transform:rotate(2deg)}.prods img:nth-child(4){transform:rotate(-3deg)}
.cards{position:absolute;left:1112px;top:100px;display:flex}
.c{width:150px;margin-left:-22px;position:relative;filter:drop-shadow(0 0 22px #ffd866) drop-shadow(0 0 5px #fff)}
.c img{width:100%;display:block;border-radius:9px}
.c:after{content:"";position:absolute;inset:0;border-radius:9px;background:linear-gradient(115deg,transparent 28%,#ffffff66 47%,#ffd86633 53%,transparent 72%)}
.c:nth-child(1){transform:rotate(-8deg) translateY(34px)}.c:nth-child(2){transform:rotate(-4deg) translateY(14px)}.c:nth-child(3){transform:translateY(0);z-index:2}.c:nth-child(4){transform:rotate(4deg) translateY(14px)}.c:nth-child(5){transform:rotate(8deg) translateY(34px)}
.mais{position:absolute;right:50px;bottom:30px;width:960px;text-align:center;font-size:40px;color:#f2c14e}
.c:nth-child(3){transform:scale(1.1)!important}</style></head><body><div class="bg"></div><div class="dots"></div>
<div class="t">BLACK FRIDAY · BEATERISTA</div><h1>Apostila<em>Robôterista</em></h1>
<div class="sub">4 materiais pra imprimir + 5 figurinhas lendárias de presente</div>
<div class="preco"><div><s>de R$ 99,60</s><br><b>R$ 79,90</b></div><div class="btn">jogos.beaterista.com.br</div></div>
<div class="prods"><img src="img/ritmo.png"><img src="img/harmonia.png"><img src="img/pratica.png"><img src="img/memoria.png"></div>
<div class="cards"><div class="c"><img src="lendarias-png/lendaria-01.png"></div><div class="c"><img src="lendarias-png/lendaria-02.png"></div><div class="c"><img src="lendarias-png/lendaria-03.png"></div><div class="c"><img src="lendarias-png/lendaria-04.png"></div><div class="c"><img src="lendarias-png/lendaria-05.png"></div></div>
</body></html>
