<!doctype html><html><head><meta charset="utf-8"><style>@font-face{font-family:Anton;src:url(img/anton.woff2) format('woff2')}
*{box-sizing:border-box;margin:0}body{width:1080px;height:1350px;background:#a8182e;color:#f3eadc;font-family:Anton,Anton,Impact,sans-serif;position:relative;overflow:hidden}
.bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 62%,#e0405a55,transparent 60%)}
.dots{position:absolute;right:30px;top:30px;width:300px;height:220px;background:radial-gradient(#f2c14e 2px,transparent 2.5px) 0 0/22px 22px;opacity:.5}
.t{position:absolute;left:60px;top:50px;font:26px ui-monospace,monospace;letter-spacing:.1em}
h1{position:absolute;left:60px;top:90px;font-size:150px;line-height:1.1;font-weight:400;text-transform:uppercase}h1 em{display:block;color:#f2c14e;font-style:normal}
.prods{position:absolute;left:50px;right:50px;top:420px;display:flex;gap:14px}
.prods div{flex:1;background:#fff;border-radius:10px;padding:5px 5px 0;overflow:hidden;align-self:flex-start;box-shadow:0 10px 0 #55101a;transform:rotate(-2deg)}.prods div:nth-child(even){transform:rotate(2deg) translateY(14px)}
.prods img{width:100%;display:block;border-radius:6px}
.mais{position:absolute;top:742px;left:0;right:0;text-align:center;font-size:44px;color:#f2c14e}
.cards{position:absolute;left:40px;right:40px;top:790px;display:flex;justify-content:center}
.c{width:230px;margin:0 -10px;position:relative;filter:drop-shadow(0 0 28px #ffd866) drop-shadow(0 0 6px #fff)}
.c:nth-child(1){transform:rotate(-12deg) translateY(30px)}.c:nth-child(2){transform:rotate(-6deg) translateY(8px)}.c:nth-child(4){transform:rotate(6deg) translateY(8px)}.c:nth-child(5){transform:rotate(12deg) translateY(30px)}.c:nth-child(3){z-index:2;transform:scale(1.12)}
.c img{width:100%;display:block;border-radius:10px}
.c:after{content:"";position:absolute;inset:0;border-radius:10px;background:linear-gradient(115deg,transparent 28%,#ffffff66 47%,#ffd86633 53%,transparent 72%);mix-blend-mode:screen}
.preco{position:absolute;left:60px;bottom:46px;display:flex;align-items:flex-end;gap:22px}
.preco b{white-space:nowrap;font-size:96px;font-weight:400;color:#f2c14e;line-height:1}.preco s{font:28px system-ui;opacity:.8}.preco small{font:600 24px system-ui;display:block;max-width:210px;margin-bottom:10px;line-height:1.2}
.btn{position:absolute;right:60px;bottom:50px;background:#10234a;padding:18px 26px;border-radius:10px;font:600 28px system-ui}
</style></head><body><div class="bg"></div><div class="dots"></div>
<div class="t">BLACK FRIDAY · BEATERISTA</div><h1>Apostila<em>Robôterista</em></h1>
<div class="prods" style="top:470px"><div><img src="img/ritmo.png"></div><div><img src="img/harmonia.png"></div><div><img src="img/pratica.png"></div><div><img src="img/memoria-quadrada.png"></div></div>

<div class="cards"><div class="c"><img src="lendarias-png/lendaria-01.png"></div><div class="c"><img src="lendarias-png/lendaria-02.png"></div><div class="c"><img src="lendarias-png/lendaria-03.png"></div><div class="c"><img src="lendarias-png/lendaria-04.png"></div><div class="c"><img src="lendarias-png/lendaria-05.png"></div></div>
<div class="preco"><div><s>de R$ 99,60</s><b>R$ 79,90</b></div></div>
<div class="btn">jogos.beaterista.com.br</div></body></html>
