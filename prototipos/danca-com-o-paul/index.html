<title>Dança com o Paul</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Gochi+Hand&family=Hanken+Grotesk:wght@500;700;800&display=swap">
<style>
/* Layout: uma tela só, em pé. Topo com placar, Paul grande no centro, pista de setas descendo, 4 botões grandes embaixo.
   Visual fixo da marca (creme, azul-marinho, vinho, mostarda), igual ao app dos alunos. */
:root{
  --creme:#f3eadc; --creme2:#ebdfcc; --marinho:#0f2347; --vinho:#a8182e; --mostarda:#e8a92b; --petroleo:#1f6f78; --branco:#fffaf0;
  --f-display:'Anton','Impact',sans-serif; --f-mao:'Gochi Hand','Comic Sans MS',cursive; --f-texto:'Hanken Grotesk',system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{box-sizing:border-box}
body{background:var(--creme);color:var(--marinho);font-family:var(--f-texto);font-size:16px;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;overflow:hidden}
.game{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px;position:relative}
.hud{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.hud h1{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1;text-transform:uppercase;letter-spacing:.5px}
.hud h1 span{color:var(--vinho)}
.stats{display:flex;gap:14px;font-family:var(--f-texto);font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.stats b{display:block;font-family:var(--f-display);font-weight:400;font-size:24px;letter-spacing:0;line-height:1}
.stats div{text-align:right}
.palco{position:relative;flex:0 0 auto;height:min(33vh,290px);display:flex;align-items:flex-end;justify-content:center}
.palco::before{content:"";position:absolute;left:-10px;right:-10px;bottom:0;height:46%;background:var(--vinho);clip-path:polygon(0 12%,8% 6%,18% 13%,30% 5%,42% 12%,55% 5%,68% 12%,80% 6%,92% 12%,100% 7%,100% 100%,0 100%)}
#paul{position:relative;height:100%;width:auto;aspect-ratio:1;object-fit:contain;pointer-events:none;filter:drop-shadow(0 6px 0 rgba(15,35,71,.18))}
.cena{position:absolute;top:2px;left:0;font-family:var(--f-mao);font-size:26px;line-height:1.05;max-width:46%;color:var(--marinho);opacity:.0;transition:opacity .3s}
.cena.on{opacity:1}
.pista{position:relative;flex:1 1 0;min-height:0;border:3px solid var(--marinho);border-radius:18px;background:var(--branco);overflow:hidden;box-shadow:6px 6px 0 var(--mostarda)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.contagem{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:120px;color:var(--vinho);pointer-events:none;opacity:0}
.pads{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pad{appearance:none;border:3px solid var(--marinho);border-radius:16px;height:clamp(64px,11vh,92px);display:flex;align-items:center;justify-content:center;background:var(--c);box-shadow:0 5px 0 var(--marinho);cursor:pointer;padding:0;transition:transform .05s,box-shadow .05s}
.pad:active,.pad.on{transform:translateY(4px);box-shadow:0 1px 0 var(--marinho)}
.pad:focus-visible{outline:4px solid var(--mostarda);outline-offset:3px}
.pad svg{width:46%;height:46%}
.pad svg path{fill:var(--creme)}
.tela{position:absolute;inset:-10px;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;background:var(--creme);padding:20px;background-image:radial-gradient(#d9b9a8 2.5px,transparent 3px);background-size:40px 40px}
.tela[hidden]{display:none}
.tela img{height:min(36vh,300px);width:auto;aspect-ratio:1;object-fit:contain}
.tela h2{font-family:var(--f-display);font-weight:400;font-size:clamp(46px,14vw,74px);line-height:.95;text-transform:uppercase}
.tela h2 span{color:var(--vinho);display:block}
.tela p{font-family:var(--f-mao);font-size:26px;line-height:1.1;max-width:22em}
.modos{display:flex;gap:10px}
.modo{appearance:none;font:800 15px var(--f-texto);text-transform:uppercase;letter-spacing:.06em;padding:11px 18px;border:3px solid var(--marinho);border-radius:999px;background:var(--creme);color:var(--marinho);cursor:pointer}
.modo[aria-pressed="true"]{background:var(--marinho);color:var(--creme)}
.modo:focus-visible,.go:focus-visible{outline:4px solid var(--mostarda);outline-offset:3px}
.go{appearance:none;font:400 30px var(--f-display);text-transform:uppercase;letter-spacing:1px;padding:14px 38px;border:3px solid var(--marinho);border-radius:16px;background:var(--vinho);color:var(--creme);box-shadow:0 6px 0 var(--marinho);cursor:pointer}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 var(--marinho)}
.dica{font:600 13px var(--f-texto);opacity:.75}
.estrelas{font-size:54px;letter-spacing:6px;color:var(--mostarda);text-shadow:0 3px 0 var(--marinho);line-height:1}
.estrelas i{font-style:normal;opacity:.25}
.estrelas i.on{opacity:1}
.res{display:flex;gap:18px;font-weight:800;text-transform:uppercase;font-size:13px;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.res b{display:block;font-family:var(--f-display);font-weight:400;font-size:34px;letter-spacing:0;line-height:1}
.rec{font:700 14px var(--f-texto);color:var(--vinho);min-height:1.2em}
@media (max-height:640px){.palco{height:28vh}.pad{height:58px}.tela img{height:26vh}}
@media (prefers-reduced-motion:reduce){.pad{transition:none}.cena{transition:none}}
</style>

<main class="game" id="game">
  <header class="hud">
    <h1>dança com o <span>paul</span></h1>
    <div class="stats" aria-live="off">
      <div>pontos<b id="s-pts">0</b></div>
      <div>combo<b id="s-combo">0</b></div>
    </div>
  </header>
  <section class="palco" aria-label="Paul dançando">
    <div class="cena" id="cena"></div>
    <img id="paul" alt="Paul, o robô da Beaterista, dançando" src="sprites/danca-idle_01.webp" draggable="false">
  </section>
  <section class="pista" id="pista" aria-label="Pista: toque na seta quando ela chegar na linha">
    <canvas id="cv"></canvas>
    <div class="contagem" id="contagem"></div>
  </section>
  <div class="pads" id="pads">
    <button class="pad" data-lane="0" style="--c:var(--vinho)" aria-label="seta pra esquerda"><svg viewBox="0 0 100 100" style="transform:rotate(0deg)"><path d="M12 50 L50 14 L50 36 L88 36 L88 64 L50 64 L50 86 Z"/></svg></button>
    <button class="pad" data-lane="1" style="--c:var(--marinho)" aria-label="seta pra baixo"><svg viewBox="0 0 100 100" style="transform:rotate(270deg)"><path d="M12 50 L50 14 L50 36 L88 36 L88 64 L50 64 L50 86 Z"/></svg></button>
    <button class="pad" data-lane="2" style="--c:#b07d12" aria-label="seta pra cima"><svg viewBox="0 0 100 100" style="transform:rotate(90deg)"><path d="M12 50 L50 14 L50 36 L88 36 L88 64 L50 64 L50 86 Z"/></svg></button>
    <button class="pad" data-lane="3" style="--c:var(--petroleo)" aria-label="seta pra direita"><svg viewBox="0 0 100 100" style="transform:rotate(180deg)"><path d="M12 50 L50 14 L50 36 L88 36 L88 64 L50 64 L50 86 Z"/></svg></button>
  </div>

  <div class="tela" id="inicio">
    <img src="sprites/danca-left.webp" alt="">
    <h2>dança com<span>o paul</span></h2>
    <p>toque na seta quando ela chegar na linha. o Paul copia o seu passo!</p>
    <div class="modos" role="group" aria-label="modo de jogo">
      <button class="modo" id="m-inf" aria-pressed="false">infantil</button>
      <button class="modo" id="m-nor" aria-pressed="true">normal</button>
    </div>
    <button class="go" id="bora">bora dançar</button>
    <div class="modos"><button class="modo" id="cal-btn">calibrar o som</button></div>
    <div class="dica" id="off"></div>
    <div class="dica">no computador: setas do teclado ou A S W D</div>
    <div class="rec" id="rec-ini"></div>
  </div>

  <div class="tela" id="cal" hidden>
    <h2>calibrar<span>o som</span></h2>
    <p id="cal-msg">vai tocar uns tiques. toque na tela junto com cada tique, 8 vezes.</p>
    <div class="estrelas" id="cal-n" style="font-size:40px;color:var(--marinho);text-shadow:none">0 / 8</div>
    <button class="go" id="cal-go">começar</button>
    <button class="modo" id="cal-x">voltar</button>
  </div>
  <div class="tela" id="fim" hidden>
    <img id="fim-paul" src="sprites/danca-idle_01.webp" alt="">
    <div class="estrelas" id="fim-est" aria-label="estrelas"></div>
    <p id="fim-msg"></p>
    <div class="res"><div>pontos<b id="r-pts">0</b></div><div>precisão<b id="r-acc">0%</b></div><div>combo máx.<b id="r-cmb">0</b></div></div>
    <div class="rec" id="r-rec"></div>
    <div class="modos"><button class="go" id="de-novo">de novo</button></div>
    <button class="modo" id="trocar">trocar modo</button>
  </div>
</main>

<script>
(function(){
'use strict';
var SETS=['danca','guitarra','bateria'], POSES=['left','down','up','right'];
var CENAS=['agora é dança! 🕶','agora é guitarra!','agora é bateria!'];
var COR=['#a8182e','#0f2347','#b07d12','#1f6f78'];
var $=function(s){return document.querySelector(s)};
var paul=$('#paul'), cv=$('#cv'), g=cv.getContext('2d');
var OFF=0, modo='normal', ctx=null, t0=0, beat=.5, running=false, notes=[], S={}, raf=0, timer=0, nextBeat=0, auto=false;
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
// pré-carrega os 18 quadros
SETS.forEach(function(s){['idle_01','idle_02','left','down','up','right'].forEach(function(f){var i=new Image();i.src='sprites/'+s+'-'+f+'.webp'})});
function load(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

// ---------- cartela: 16 tempos por cena; '-' = descanso ----------
var SEQ=['-','L','D','-','U','R','L','-','D','D','U','U','L','R','-','-'];
var LANE={L:0,D:1,U:2,R:3};
function chart(m){
  var out=[],cfg=m==='infantil'?{bpm:100,win:[.11,.21],travel:2.2}:{bpm:110,win:[.09,.17],travel:1.9};
  for(var b=0;b<48;b++){
    var c=SEQ[b%16];
    if(m==='infantil'){ if(b%2) continue; if(c==='-') c='LDUR'[(b/2)%4|0]; }
    if(c!=='-') out.push({b:b,lane:LANE[c]});
    if(m==='normal'&&b>=16&&b%8===7) out.push({b:b+.5,lane:(b*3+1)%4});
    if(m==='normal'&&b>=32&&b%8===3) out.push({b:b+.5,lane:(b+2)%4});
  }
  return {notes:out,cfg:cfg};
}

// ---------- som: batida sintetizada (a mesma do reel) ----------
function noise(len){var b=ctx.createBuffer(1,len*ctx.sampleRate|0,ctx.sampleRate),d=b.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b}
var NZ=null;
function env(node,t,a,d,v){node.gain.setValueAtTime(0,t);node.gain.linearRampToValueAtTime(v,t+a);node.gain.exponentialRampToValueAtTime(.0008,t+a+d)}
function kick(t){var o=ctx.createOscillator(),gn=ctx.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(45,t+.15);env(gn,t,.002,.26,.95);o.connect(gn).connect(ctx.destination);o.start(t);o.stop(t+.3)}
function snare(t){var s=ctx.createBufferSource();s.buffer=NZ;var f=ctx.createBiquadFilter();f.type='highpass';f.frequency.value=1400;var gn=ctx.createGain();env(gn,t,.001,.16,.5);s.connect(f).connect(gn).connect(ctx.destination);s.start(t);s.stop(t+.2);var o=ctx.createOscillator(),g2=ctx.createGain();o.frequency.value=190;env(g2,t,.001,.1,.35);o.connect(g2).connect(ctx.destination);o.start(t);o.stop(t+.12)}
function hat(t,open){var s=ctx.createBufferSource();s.buffer=NZ;var f=ctx.createBiquadFilter();f.type='highpass';f.frequency.value=7000;var gn=ctx.createGain();env(gn,t,.001,open?.1:.04,open?.22:.18);s.connect(f).connect(gn).connect(ctx.destination);s.start(t);s.stop(t+.12)}
function bass(t,fr){var o=ctx.createOscillator(),f=ctx.createBiquadFilter(),gn=ctx.createGain();o.type='sawtooth';o.frequency.value=fr;f.type='lowpass';f.frequency.value=420;env(gn,t,.005,.4,.32);o.connect(f).connect(gn).connect(ctx.destination);o.start(t);o.stop(t+.45)}
function stab(t){[164.8,196,246.9].forEach(function(fr){var o=ctx.createOscillator(),gn=ctx.createGain();o.type='triangle';o.frequency.value=fr;env(gn,t,.003,.3,.1);o.connect(gn).connect(ctx.destination);o.start(t);o.stop(t+.35)})}
function tick(t,hi){var o=ctx.createOscillator(),gn=ctx.createGain();o.frequency.value=hi?1500:1000;env(gn,t,.001,.06,.3);o.connect(gn).connect(ctx.destination);o.start(t);o.stop(t+.08)}
var BASSL=[82.41,82.41,98,110,82.41,82.41,123.47,110];
var NOTA=[329.6,392,440,493.9]; // E4 G4 A4 B4
function blip(lane,good){var t=ctx.currentTime,o=ctx.createOscillator(),gn=ctx.createGain();o.type='square';o.frequency.value=NOTA[lane]*(good?1:2);env(gn,t,.004,.16,.12);o.connect(gn).connect(ctx.destination);o.start(t);o.stop(t+.2)}
function schedule(){
  var lim=ctx.currentTime+.18;
  while(true){
    var t=t0+nextBeat*beat; if(t>lim) break;
    var i=nextBeat-4;
    if(i<0){tick(t,i===-4)}
    else if(i<48){
      var k=i%4;
      if(k===0||k===2)kick(t); if(k===1||k===3)snare(t);
      hat(t,false);hat(t+beat/2,true);bass(t,BASSL[i%8]); if(k===1||k===3)stab(t+beat/2);
    }
    nextBeat++; if(nextBeat>4+48+1) break;
  }
}

// ---------- pista ----------
function resize(){var r=cv.getBoundingClientRect(),d=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);g.setTransform(d,0,0,d,0,0);S.W=r.width;S.H=r.height}
window.addEventListener('resize',resize);
function arrow(x,y,s,lane,fill,stroke,alpha){
  g.save();g.translate(x,y);g.rotate([0,270,90,180][lane]*Math.PI/180);g.globalAlpha=alpha==null?1:alpha;
  var r=s*.22;g.fillStyle=fill;g.strokeStyle=stroke;g.lineWidth=Math.max(2,s*.06);
  g.beginPath();g.roundRect(-s/2,-s/2,s,s,r);g.fill();g.stroke();
  g.fillStyle=stroke===COR[lane]?'#fffaf0':'#fffaf0';
  var k=s*.0075;g.beginPath();g.moveTo(-38*k,0);g.lineTo(0,-36*k);g.lineTo(0,-14*k);g.lineTo(38*k,-14*k);g.lineTo(38*k,14*k);g.lineTo(0,14*k);g.lineTo(0,36*k);g.closePath();g.fill();
  g.restore();
}
function now(){return ctx.currentTime-t0}
function loadOff(){var v=load('paul-danca-off');OFF=(typeof v==='number')?v:Math.min(.25,((ctx&&ctx.outputLatency)||0)+((ctx&&ctx.baseLatency)||0));showOff()}
function showOff(){var e=$('#off');if(e)e.textContent='atraso do som: '+Math.round(OFF*1000)+' ms'}
function draw(){
  var W=S.W,H=S.H,lw=W/4,sz=Math.min(lw*.78,64),hitY=H-sz*.9,tr=S.cfg.travel,n=now();
  g.clearRect(0,0,W,H);
  for(var l=0;l<4;l++){ if(l%2===0){g.fillStyle='rgba(15,35,71,.045)';g.fillRect(l*lw,0,lw,H)} if(S.flash[l]>n){g.fillStyle='rgba(232,169,43,'+((S.flash[l]-n)*2.2)+')';g.fillRect(l*lw,0,lw,H)} }
  g.strokeStyle='rgba(15,35,71,.25)';g.lineWidth=2;g.setLineDash([6,8]);g.beginPath();g.moveTo(0,hitY);g.lineTo(W,hitY);g.stroke();g.setLineDash([]);
  for(var l2=0;l2<4;l2++) arrow(l2*lw+lw/2,hitY,sz,l2,'rgba(255,250,240,.0)',COR[l2],.45);
  for(var i=0;i<notes.length;i++){
    var nt=notes[i]; if(nt.done&&nt.res!=='miss') continue;
    var y=hitY-(nt.t-n)/tr*hitY; if(y<-sz||y>H+sz) continue;
    arrow(nt.lane*lw+lw/2,y,sz,nt.lane,COR[nt.lane],'#0f2347',nt.res==='miss'?.25:1);
  }
  g.textAlign='center';g.font='400 26px Anton,Impact,sans-serif';
  for(var p=S.pops.length-1;p>=0;p--){var q=S.pops[p],a=1-(n-q.t)/.7;if(a<=0){S.pops.splice(p,1);continue}g.globalAlpha=a;g.fillStyle=q.c;g.strokeStyle='#fffaf0';g.lineWidth=5;var yy=hitY-sz-(1-a)*30;g.strokeText(q.txt,q.x,yy);g.fillText(q.txt,q.x,yy);g.globalAlpha=1}
}
function setFrame(f){var s=SETS[S.scene||0],src='sprites/'+s+'-'+f+'.webp';if(paul.dataset.f!==s+f){paul.dataset.f=s+f;paul.src=src}}
function bounce(){if(reduce||!paul.animate) return;paul.animate([{transform:'translateY(0) scale(1)'},{transform:'translateY(-14px) scale(1.02)'},{transform:'translateY(0) scale(1)'}],{duration:Math.min(380,beat*700),easing:'ease-out'})}
function hud(){$('#s-pts').textContent=S.score.toLocaleString('pt-BR');$('#s-combo').textContent=S.combo}
function loop(){
  if(!running) return;
  var n=now(),bp=n/beat-4;
  if(auto){for(var i=0;i<notes.length;i++){var nt=notes[i];if(!nt.done&&Math.abs(nt.t+OFF-n)<.012){press(nt.lane)}}}
  var cd=$('#contagem');
  if(bp<0){var k=Math.ceil(-bp);cd.textContent=k;cd.style.opacity=1-((-bp)%1)*.6}else{cd.style.opacity=0}
  var sc=bp<0?0:Math.min(2,Math.floor(bp/16));
  if(sc!==S.scene||S.first){S.scene=sc;S.first=false;var ce=$('#cena');ce.textContent=CENAS[sc];ce.classList.add('on');clearTimeout(S.ct);S.ct=setTimeout(function(){ce.classList.remove('on')},2200);S.until=0}
  var bi=Math.floor(bp);
  if(bi!==S.lastBeat){S.lastBeat=bi;if(bi>=0)bounce()}
  if(n>=S.until){setFrame(bi>=0&&bi%2?'idle_02':'idle_01')}
  // erros: nota passou da janela
  for(var j=0;j<notes.length;j++){var m=notes[j];if(!m.done&&n-OFF-m.t>S.cfg.win[1]){m.done=true;m.res='miss';S.miss++;S.combo=0;S.pops.push({t:n,txt:'ops',c:'#a8182e',x:(m.lane+.5)*S.W/4});S.until=n+.36;setFrame('idle_02');hud()}}
  draw();
  if(n>(4+48)*beat+1.2){finish();return}
  raf=requestAnimationFrame(loop);
}
function press(lane){
  if(!running||!ctx) return;
  var n=now()-OFF,best=null,bd=9;
  for(var i=0;i<notes.length;i++){var nt=notes[i];if(nt.done||nt.lane!==lane) continue;var d=Math.abs(nt.t-n);if(d<bd){bd=d;best=nt}}
  var pad=document.querySelector('.pad[data-lane="'+lane+'"]');pad.classList.add('on');setTimeout(function(){pad.classList.remove('on')},90);
  S.flash[lane]=now()+.25;
  if(!best||bd>S.cfg.win[1]+.03){return}
  best.done=true;var perf=bd<=S.cfg.win[0];best.res=perf?'p':'g';
  if(perf)S.perf++;else S.good++;
  S.combo++;S.maxc=Math.max(S.maxc,S.combo);
  S.score+=(perf?100:60)*Math.min(4,1+Math.floor(S.combo/10));
  S.pops.push({t:now(),txt:perf?'perfeito!':'bom!',c:perf?'#1f6f78':'#b07d12',x:(lane+.5)*S.W/4});
  S.until=now()+.3;setFrame(POSES[lane]);blip(lane,perf);hud();
  if(!reduce&&paul.animate)paul.animate([{transform:'scale(1)'},{transform:'scale(1.06) rotate('+(lane===0?-3:lane===3?3:0)+'deg)'},{transform:'scale(1)'}],{duration:180,easing:'ease-out'});
}
function start(){
  if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();NZ=noise(.5)}
  if(ctx.state==='suspended') ctx.resume();
  loadOff();
  var c=chart(modo);beat=60/c.cfg.bpm;
  $('#inicio').hidden=true;$('#fim').hidden=true;$('#cal').hidden=true;
  resize();
  S={cfg:c.cfg,score:0,combo:0,maxc:0,perf:0,good:0,miss:0,pops:[],flash:[0,0,0,0],scene:0,first:true,until:0,lastBeat:-99,W:S.W,H:S.H};
  notes=c.notes.map(function(x){return {t:(4+x.b)*beat,lane:x.lane,done:false,res:null}});
  hud();paul.dataset.f='';setFrame('idle_01');
  t0=ctx.currentTime+.35;nextBeat=0;running=true;
  clearInterval(timer);timer=setInterval(schedule,25);schedule();
  cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);
}
function finish(){
  running=false;clearInterval(timer);cancelAnimationFrame(raf);$('#contagem').style.opacity=0;
  var tot=notes.length,acc=tot?(S.perf+S.good*.7)/tot:0,st=acc>=.9?3:acc>=.7?2:acc>=.45?1:0;
  var key='paul-danca-'+modo,best=load(key)||{score:0,stars:0},novo=S.score>best.score;
  if(novo||st>best.stars)save(key,{score:Math.max(best.score,S.score),stars:Math.max(best.stars,st)});
  $('#fim-est').innerHTML=[0,1,2].map(function(i){return '<i class="'+(i<st?'on':'')+'">★</i>'}).join('');
  $('#fim-est').setAttribute('aria-label',st+' de 3 estrelas');
  $('#fim-msg').textContent=['bora de novo? o groove vem com a prática.','boa! você já pegou o pulso.','mandou bem demais! o Paul tá orgulhoso.','perfeito! você dança melhor que eu. 🤖'][st];
  $('#r-pts').textContent=S.score.toLocaleString('pt-BR');$('#r-acc').textContent=Math.round(acc*100)+'%';$('#r-cmb').textContent=S.maxc;
  $('#r-rec').textContent=novo&&S.score>0?'novo recorde!':(best.score?'recorde: '+best.score.toLocaleString('pt-BR'):'');
  $('#fim-paul').src='sprites/'+SETS[st===3?2:st===2?1:0]+'-'+(st>=2?'up':'idle_02')+'.webp';
  $('#fim').hidden=false;
}
// ---------- calibrar o atraso do som ----------
var CAL=null;
function calStart(){
  if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();NZ=noise(.5)}
  if(ctx.state==='suspended') ctx.resume();
  var base=ctx.currentTime+.8,ticks=[];
  for(var i=0;i<8;i++){var t=base+i*.6;ticks.push(t);tick(t,true)}
  CAL={ticks:ticks,d:[],end:base+8*.6+.6};
  $('#cal-n').textContent='0 / 8';$('#cal-msg').textContent='toque junto com o tique...';$('#cal-go').hidden=true;
  setTimeout(calEnd,(CAL.end-ctx.currentTime)*1000+100);
}
function calTap(){
  if(!CAL) return;
  var n=ctx.currentTime,best=null,bd=9;
  CAL.ticks.forEach(function(t){var d=n-t;if(Math.abs(d)<Math.abs(bd)){bd=d;best=t}});
  if(Math.abs(bd)<.4){CAL.d.push(bd);$('#cal-n').textContent=Math.min(8,CAL.d.length)+' / 8'}
}
function calEnd(){
  if(!CAL) return;var d=CAL.d.slice(-6).sort(function(a,b){return a-b});CAL=null;$('#cal-go').hidden=false;
  if(d.length<3){$('#cal-msg').textContent='não deu pra medir. toque junto com cada tique e tente de novo.';return}
  OFF=Math.max(-.1,Math.min(.35,d[d.length>>1]));save('paul-danca-off',OFF);showOff();
  $('#cal-msg').textContent='pronto! atraso do som: '+Math.round(OFF*1000)+' ms. já está salvo.';$('#cal-go').textContent='medir de novo';
}
$('#cal-btn').onclick=function(){$('#inicio').hidden=true;$('#cal').hidden=false;$('#cal-go').textContent='começar'};
$('#cal-go').onclick=calStart;
$('#cal-x').onclick=function(){CAL=null;$('#cal').hidden=true;$('#inicio').hidden=false};
$('#cal').addEventListener('pointerdown',function(e){if(e.target.closest('button')) return;calTap()});
// ---------- controles ----------
function setModo(m){modo=m;$('#m-inf').setAttribute('aria-pressed',m==='infantil');$('#m-nor').setAttribute('aria-pressed',m==='normal');showRec()}
function showRec(){var b=load('paul-danca-'+modo);$('#rec-ini').textContent=b&&b.score?'seu recorde: '+b.score.toLocaleString('pt-BR')+' · '+'★'.repeat(b.stars):''}
$('#m-inf').onclick=function(){setModo('infantil')};
$('#m-nor').onclick=function(){setModo('normal')};
$('#bora').onclick=start;$('#de-novo').onclick=start;
$('#trocar').onclick=function(){$('#fim').hidden=true;$('#inicio').hidden=false;showRec()};
$('#pads').addEventListener('pointerdown',function(e){var b=e.target.closest('.pad');if(b){e.preventDefault();press(+b.dataset.lane)}});
$('#pista').addEventListener('pointerdown',function(e){var r=cv.getBoundingClientRect();press(Math.max(0,Math.min(3,Math.floor((e.clientX-r.left)/r.width*4))))});
var KEYS={ArrowLeft:0,a:0,A:0,ArrowDown:1,s:1,S:1,ArrowUp:2,w:2,W:2,ArrowRight:3,d:3,D:3};
window.addEventListener('keydown',function(e){if(e.repeat) return;if(e.key in KEYS){e.preventDefault();press(KEYS[e.key])}else if((e.key==='Enter'||e.key===' ')&&!$('#inicio').hidden){e.preventDefault();start()}});
document.addEventListener('visibilitychange',function(){if(document.hidden&&running){running=false;clearInterval(timer);cancelAnimationFrame(raf);if(ctx)ctx.suspend();$('#inicio').hidden=false}});
window.__danca={autoplay:function(v){auto=v!==false},state:function(){return S}};
setModo('normal');resize();(function(){var v=load('paul-danca-off');if(typeof v==='number')OFF=v})();showOff();
})();
</script>
