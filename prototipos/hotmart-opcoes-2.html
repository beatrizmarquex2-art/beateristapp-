<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hotmart: 3 opções (rodada 2)</title><link rel="stylesheet" href="../css/fonts.css">
<style>
*{box-sizing:border-box}
:root{--navy:#0e2347;--azul:#17356b;--verm:#b5162b;--ouro:#f6c44f;--creme:#f6eee2;--ink:#14111a}
body{margin:0;background:#e9e1d2;color:var(--ink);font-family:"Hanken Grotesk",sans-serif;padding:18px 14px 50px}
h1{font:400 26px "Anton";text-transform:uppercase;margin:0 0 4px}.sub{margin:0 0 20px;font-size:13px;opacity:.8;max-width:760px}
.op{margin:0 0 44px}.op>h2{font:400 21px "Anton";text-transform:uppercase;color:var(--verm);margin:0 0 4px}.op>p{margin:0 0 12px;font-size:13px;max-width:760px}
.lab{font:700 11px "Hanken Grotesk";letter-spacing:.08em;text-transform:uppercase;margin:0 0 6px;opacity:.7}
.esc{transform-origin:top left}
.cx{overflow:hidden;position:relative;box-shadow:0 0 0 3px var(--ink)}
.banner{width:1600px;height:400px}.capa{width:800px;height:800px}
.banner *,.capa *{position:absolute}
.t{font-family:"Anton",sans-serif;text-transform:uppercase;line-height:.95;margin:0}
.t span,.t em{position:static;font-style:normal}
.phone{border:9px solid #0b0b0f;border-radius:34px;background:#0b0b0f;overflow:hidden;box-shadow:8px 12px 0 rgba(0,0,0,.35)}
.phone img{position:static;display:block;width:100%;height:100%;object-fit:cover;object-position:top}
/* 1 · o app na mão */
.P .banner,.P .capa{background:radial-gradient(circle at 70% 40%,#2a52b5 0,#17356b 40%,#0e2347 78%)}
.P .b-logo{height:84px;left:70px;top:38px}
.P .b-t{left:70px;top:122px;font-size:90px;color:#fff;width:820px;line-height:.92}.P .b-t em{color:var(--ouro)}
.P .b-fita{left:70px;top:322px;background:var(--verm);color:#fff;font:400 32px "Anton";text-transform:uppercase;padding:8px 22px;border:4px solid #fff;transform:rotate(-1.5deg);box-shadow:5px 5px 0 rgba(0,0,0,.4)}
.P .b-p1{left:920px;top:34px;width:210px;height:440px;transform:rotate(-7deg)}
.P .b-p2{left:1120px;top:10px;width:230px;height:480px;transform:rotate(0deg);z-index:2}
.P .b-p3{left:1340px;top:38px;width:210px;height:440px;transform:rotate(7deg)}
.P .c-logo{height:100px;left:50%;top:34px;transform:translateX(-50%)}
.P .c-t{left:0;right:0;top:160px;text-align:center;font-size:94px;color:#fff}.P .c-t em{color:var(--ouro)}
.P .c-p1{left:60px;top:370px;width:230px;height:480px;transform:rotate(-8deg)}
.P .c-p2{left:285px;top:340px;width:250px;height:520px;z-index:2}
.P .c-p3{left:520px;top:372px;width:230px;height:480px;transform:rotate(8deg)}
.P .c-fita{left:50%;bottom:36px;transform:translateX(-50%) rotate(-1.5deg);white-space:nowrap;background:var(--verm);color:#fff;font:400 40px "Anton";text-transform:uppercase;padding:10px 28px;border:5px solid #fff;box-shadow:6px 6px 0 rgba(0,0,0,.4);z-index:5}
.P .c-paul{height:300px;right:6px;bottom:90px;z-index:4;filter:drop-shadow(6px 8px 0 rgba(0,0,0,.35))}
/* 2 · premium dourado */
.G .banner,.G .capa{background:radial-gradient(circle at 30% 50%,#2b2210 0,#120f0a 55%,#07060a 100%)}
.G .ouro{background:linear-gradient(#fff3bf,#e4ad35 52%,#9a6a14);-webkit-background-clip:text;background-clip:text;color:transparent}
.G .moldura{inset:16px;border:3px solid #d9a93a;border-radius:10px}.G .moldura2{inset:28px;border:1px solid rgba(217,169,58,.55);border-radius:6px}
.G .glow{width:760px;height:760px;left:-60px;top:-180px;border-radius:50%;background:radial-gradient(circle,rgba(246,196,79,.35),transparent 62%)}
.G .b-paul{height:420px;left:110px;bottom:-4px;filter:drop-shadow(0 12px 18px rgba(0,0,0,.6))}
.G .b-sel{left:560px;top:56px;font:700 22px "Hanken Grotesk";letter-spacing:.34em;text-transform:uppercase;color:#e8d9b0}
.G .b-t{left:560px;top:104px;font-size:132px}
.G .b-linha{left:560px;top:250px;width:560px;height:2px;background:linear-gradient(90deg,#d9a93a,transparent)}
.G .b-f{left:560px;top:274px;font:400 40px "Anton";text-transform:uppercase;color:#fff;white-space:nowrap}.G .b-f em{color:#f6c44f}
.G .k{height:300px;border-radius:12px;box-shadow:0 10px 20px rgba(0,0,0,.6)}
.G .b-k1{left:1250px;top:68px;transform:rotate(-6deg)}.G .b-k2{left:1380px;top:76px;transform:rotate(6deg)}
.G .c-sel{left:0;right:0;top:70px;text-align:center;font:700 24px "Hanken Grotesk";letter-spacing:.36em;text-transform:uppercase;color:#e8d9b0}
.G .c-t{left:0;right:0;top:118px;text-align:center;font-size:132px;white-space:nowrap}
.G .c-paul{height:440px;left:50%;bottom:128px;transform:translateX(-50%);filter:drop-shadow(0 14px 20px rgba(0,0,0,.6))}
.G .c-placa{left:50%;bottom:62px;transform:translateX(-50%);white-space:nowrap;border:4px solid #d9a93a;border-radius:12px;background:linear-gradient(#2c2210,#120f0a);padding:12px 34px;font:400 42px "Anton";text-transform:uppercase;color:#f6c44f;box-shadow:0 8px 18px rgba(0,0,0,.6)}
/* 3 · com a Bea */
.B .banner,.B .capa{background:var(--creme)}
.B .b-foto{left:0;top:0;width:760px;height:400px;object-fit:cover;object-position:50% 20%;clip-path:polygon(0 0,100% 0,86% 100%,0 100%)}
.B .b-faixa{left:640px;top:0;width:60px;height:400px;background:var(--ouro);transform:skewX(-8deg)}
.B .b-logo{height:70px;left:820px;top:34px;filter:invert(1) hue-rotate(180deg)}
.B .b-t{left:820px;top:130px;font-size:84px;color:var(--navy);width:740px;line-height:.95}.B .b-t em{color:var(--verm)}
.B .b-f{left:820px;top:300px;background:var(--navy);color:#fff;font:400 32px "Anton";text-transform:uppercase;padding:8px 22px;border:4px solid var(--ink);box-shadow:5px 5px 0 var(--ink);transform:rotate(-1.5deg)}
.B .b-paul{height:260px;left:560px;bottom:-12px;filter:drop-shadow(5px 6px 0 rgba(14,35,71,.25))}
.B .c-foto{left:0;top:0;width:800px;height:430px;object-fit:cover;object-position:50% 18%}
.B .c-faixa{left:0;top:410px;width:800px;height:26px;background:var(--ouro)}
.B .c-t{left:50px;top:462px;font-size:74px;color:var(--navy);width:440px;line-height:.95}.B .c-t em{color:var(--verm)}
.B .c-f{left:50px;bottom:44px;background:var(--navy);color:#fff;font:400 36px "Anton";text-transform:uppercase;padding:9px 24px;border:4px solid var(--ink);box-shadow:5px 5px 0 var(--ink);transform:rotate(-1.5deg)}
.B .c-paul{height:330px;right:6px;bottom:-12px;filter:drop-shadow(5px 6px 0 rgba(14,35,71,.25))}
.desc{width:340px;border:3px solid var(--ink);border-radius:14px;background:#fff;padding:14px;box-shadow:5px 5px 0 var(--ink);font-size:13.5px;line-height:1.45}
.desc b{display:block;font:400 19px/1.05 "Anton";text-transform:uppercase;margin-bottom:6px}.desc ul{margin:8px 0;padding-left:18px}.desc small{display:block;margin-top:8px;opacity:.75}
.fila{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start}
</style></head><body>
<h1>Hotmart · rodada 2</h1>
<p class="sub">3 caminhos bem diferentes dos primeiros: o app de verdade na tela, um visual premium preto e dourado e uma versão com a Bea. Sem preço na imagem. Banner 1600×400 e capa 800×800.</p>
<div id="app"></div>
<script>
const PA='../assets/paul/colorido/paul-presente.webp',PB='../assets/paul/colorido/paul-baquetas-pra-cima.webp',PG='../assets/paul/colorido/paul-guitarra.webp',LOGO='../assets/entrada/logo-paul-branco.png',S1='../assets/entrada/s-aulas.jpg',S2='../assets/entrada/s-aventura.jpg',S3='../assets/entrada/s-figurinha.jpg',BEA='../assets/entrada/bea-colagem.jpg',K1='../assets/figurinhas/lendarias/L04.webp',K2='../assets/figurinhas/lendarias/L02.webp';
const DESC=`<b>Um ano inteiro de música, jogos e descobertas!</b>Aprenda brincando com o Robôterista Paul no <u>Beaterista PLAY</u>:<ul><li>jogos educativos e desafios musicais</li><li>aulas de teoria, bateria, teclado e violão</li><li>figurinhas pra colecionar</li><li>no seu ritmo, no celular, tablet ou computador</li></ul><b style="font-size:15px">Um único pagamento · 12 meses de acesso</b><small>já é aluno da escola Beaterista? seu acesso anual já está incluso: entre com o seu código.</small>`;
const ph=(c,s)=>`<div class="phone ${c}"><img src="${s}" alt=""></div>`;
const P=`<div class="P"><p class="lab">banner 1600×400</p><div class="esc" data-w="1600" data-h="400" data-s=".26"><div class="cx banner"><img class="b-logo" src="${LOGO}" alt=""><h2 class="t b-t">Aprenda música <em>jogando</em></h2><div class="b-fita">Passe Anual · 12 meses de acesso</div>${ph('b-p1',S1)}${ph('b-p3',S3)}${ph('b-p2',S2)}</div></div>
<p class="lab" style="margin-top:14px">capa 800×800</p><div class="esc" data-w="800" data-h="800" data-s=".4"><div class="cx capa"><img class="c-logo" src="${LOGO}" alt=""><h2 class="t c-t">Aprenda música<br><em>jogando</em></h2>${ph('c-p1',S1)}${ph('c-p3',S3)}${ph('c-p2',S2)}<img class="c-paul" src="${PA}" alt=""><div class="c-fita">Passe Anual · 12 meses</div></div></div></div>`;
const G=`<div class="G"><p class="lab">banner 1600×400</p><div class="esc" data-w="1600" data-h="400" data-s=".26"><div class="cx banner"><div class="glow"></div><div class="moldura"></div><div class="moldura2"></div><img class="b-paul" src="${PB}" alt=""><div class="b-sel">Robôterista Paul</div><h2 class="t b-t ouro">Passe Anual</h2><div class="b-linha"></div><div class="b-f">12 meses de jogos, aulas e <em>figurinhas</em></div><img class="k b-k1" src="${K1}" alt=""><img class="k b-k2" src="${K2}" alt=""></div></div>
<p class="lab" style="margin-top:14px">capa 800×800</p><div class="esc" data-w="800" data-h="800" data-s=".4"><div class="cx capa"><div class="glow" style="left:20px;top:80px"></div><div class="moldura"></div><div class="moldura2"></div><div class="c-sel">Robôterista Paul</div><h2 class="t c-t ouro">Passe Anual</h2><img class="c-paul" src="${PA}" alt=""><div class="c-placa">12 meses de acesso</div></div></div></div>`;
const B=`<div class="B"><p class="lab">banner 1600×400</p><div class="esc" data-w="1600" data-h="400" data-s=".26"><div class="cx banner"><img class="b-foto" src="${BEA}" alt=""><div class="b-faixa"></div><img class="b-logo" src="${LOGO}" alt=""><h2 class="t b-t">Música com a <em>Bea</em> e o Paul</h2><div class="b-f">Passe Anual · 12 meses de acesso</div><img class="b-paul" src="${PG}" alt=""></div></div>
<p class="lab" style="margin-top:14px">capa 800×800</p><div class="esc" data-w="800" data-h="800" data-s=".4"><div class="cx capa"><img class="c-foto" src="${BEA}" alt=""><div class="c-faixa"></div><h2 class="t c-t">Música com a <em>Bea</em> e o Paul</h2><div class="c-f">Passe Anual · 12 meses</div><img class="c-paul" src="${PG}" alt=""></div></div></div>`;
const op=(k,t,d,h)=>`<section class="op"><h2>${k} · ${t}</h2><p>${d}</p><div class="fila"><div>${h}</div><div><p class="lab">texto da descrição</p><div class="desc">${DESC}</div></div></div></section>`;
app.innerHTML=op('1','o app na mão','as telas de verdade do app (aulas, mapa de jogos e figurinhas) em 3 celulares: quem vê já sabe o que está comprando.',P)+op('2','premium preto e dourado','mesmo estilo das cartas lendárias: moldura dourada, brilho e o Paul no centro. passa ar de produto especial.',G)+op('3','com a Bea','a foto da Bea (professora) de um lado e o Paul do outro: confiança de escola de verdade.',B);
document.querySelectorAll('.esc').forEach(e=>{const s=+e.dataset.s;e.style.transform=`scale(${s})`;e.style.width=e.dataset.w+'px';e.style.height=e.dataset.h+'px';const w=document.createElement('div');w.style.width=(e.dataset.w*s)+'px';w.style.height=(e.dataset.h*s)+'px';e.parentNode.insertBefore(w,e);w.appendChild(e);});
setTimeout(()=>document.body.dataset.ok=1,900);
</script></body></html>
