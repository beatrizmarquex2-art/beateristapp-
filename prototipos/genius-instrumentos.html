<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Genius infinito · modelos por instrumento</title>
<link rel="stylesheet" href="../css/fonts.css">
<style>
:root{--navy:#142036;--navy2:#1a2a49;--hi:#ffd23f;--red:#d3122f;--bg:#f1e9dc}
*{box-sizing:border-box;margin:0}html,body{height:100%;overflow:hidden;background:var(--bg);font-family:"Hanken Grotesk",system-ui,sans-serif;color:#fff}
.app{height:100dvh;display:flex;flex-direction:column;padding:8px 10px 10px;gap:8px}
.card{flex:1;min-height:0;background:var(--navy);border-radius:14px;box-shadow:5px 6px 0 rgb(20 32 54/.28);padding:10px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.head{display:flex;align-items:center;gap:8px}.back{height:36px;padding:0 12px;border-radius:12px;background:#fffdf7;color:var(--navy);font:700 13px "Hanken Grotesk";display:flex;align-items:center;border:2.5px solid var(--navy)}
.ribbon{flex:1;font:400 15px "Permanent Marker",Anton,sans-serif;background:#f7b733;color:var(--navy);padding:5px 12px;transform:rotate(-1deg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:5px}.tabs i{flex:1;text-align:center;font:700 11px/1 "Hanken Grotesk";font-style:normal;padding:9px 0;border-radius:999px;border:1px solid rgb(255 255 255/.3);background:rgb(255 255 255/.08)}.tabs i.on{background:linear-gradient(180deg,#ffe58a,#f7b733);color:var(--navy);border-color:#fff4c2}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.st{display:flex;flex-direction:column;align-items:center;padding:6px 8px;border-radius:999px;background:rgb(255 255 255/.1);border:1px solid rgb(255 255 255/.2)}.st b{font:800 17px/1.05 "Hanken Grotesk"}.st small{font:700 9.5px/1 "Hanken Grotesk";letter-spacing:.1em;text-transform:uppercase;opacity:.65;margin-top:2px}
.msg{text-align:center;color:#ffe08a;font-weight:700;font-size:14px}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
svg{max-width:100%;max-height:100%;overflow:visible}
.dock{display:flex;justify-content:space-around;align-items:flex-end;padding:0 6px 2px}
.rb{display:flex;flex-direction:column;align-items:center;gap:6px;font:700 11.5px/1 "Hanken Grotesk";color:#dbe6ff;width:70px}
.rb i{width:56px;height:56px;border-radius:50%;background:rgb(255 255 255/.14);border:2px solid rgb(255 255 255/.55);box-shadow:0 4px 0 rgb(0 0 0/.3);display:grid;place-items:center;font-size:22px;font-style:normal}
.rb.main{color:#ffe08a;width:84px}.rb.main i{width:68px;height:68px;background:linear-gradient(180deg,#ffe58a,#f7b733);border-color:#fff4c2;box-shadow:0 5px 0 #b27a12,0 0 22px rgb(255 200 60/.55);color:var(--navy)}
.tag{position:absolute;right:10px;top:-9px;background:#fff;color:var(--navy);font:800 10px "Hanken Grotesk";padding:2px 8px;border-radius:99px;border:2px solid var(--navy);z-index:3}
.glow{filter:drop-shadow(0 0 10px rgb(255 235 140/.95)) brightness(1.35)}
</style></head><body><div class="app" id="app"></div>
<script>
const M=(new URLSearchParams(location.search).get('m')||'a').toLowerCase(); const NOMES={a:'XILOFONE',b:'PIANO',c:'BATERIA',d:'VIOLÃO'};
const COR=['#e8384f','#f2762e','#f7b733','#3fb27f','#2fa8c4','#3b6fd8','#e8384f','#f2762e'];
function xilo(){ // 8 barras de madeira coloridas sobre dois trilhos; a 5ª está acesa
  let s='<svg viewBox="0 0 340 300" width="340" height="300"><rect x="30" y="86" width="280" height="9" rx="4" fill="#8a5a33"/><rect x="48" y="214" width="244" height="9" rx="4" fill="#8a5a33"/>';
  for(let i=0;i<8;i++){const w=34,x=14+i*39,len=210-i*17,y=150-len/2+30,on=i===4;
    s+=`<g class="${on?'glow':''}"><rect x="${x}" y="${y}" width="${w}" height="${len}" rx="9" fill="${COR[i]}" stroke="${on?'#fff':'#142036'}" stroke-width="${on?4:3}"/><rect x="${x+5}" y="${y+6}" width="7" height="${len-12}" rx="3" fill="#fff" opacity=".28"/><circle cx="${x+w/2}" cy="${y+16}" r="3.2" fill="#142036" opacity=".55"/><circle cx="${x+w/2}" cy="${y+len-16}" r="3.2" fill="#142036" opacity=".55"/><text x="${x+w/2}" y="${y+len-34}" text-anchor="middle" font-family="Hanken Grotesk" font-weight="800" font-size="12" fill="#fff">${['dó','ré','mi','fá','sol','lá','si','dó'][i]}</text></g>`}
  s+='<g transform="translate(262 20) rotate(28)"><rect x="-3" y="0" width="6" height="86" rx="3" fill="#e9c46a" stroke="#142036" stroke-width="2.5"/><circle cx="0" cy="-4" r="11" fill="#fffdf7" stroke="#142036" stroke-width="3"/></g></svg>'; return s;}
function piano(){ // 8 teclas brancas com a nota colorida, 5 pretas; a 3ª acesa
  let s='<svg viewBox="0 0 340 300" width="340" height="300"><rect x="4" y="30" width="332" height="250" rx="16" fill="#0d1526" stroke="#fff" stroke-opacity=".3" stroke-width="2"/>';
  for(let i=0;i<8;i++){const x=12+i*39.5,on=i===2;s+=`<g class="${on?'glow':''}"><rect x="${x}" y="42" width="37" height="226" rx="7" fill="${on?'#ffe58a':'#fffdf7'}" stroke="#142036" stroke-width="2.5"/><circle cx="${x+18.5}" cy="236" r="12" fill="${COR[i]}"/><text x="${x+18.5}" y="240" text-anchor="middle" font-family="Hanken Grotesk" font-weight="800" font-size="11" fill="#fff">${['dó','ré','mi','fá','sol','lá','si','dó'][i]}</text></g>`}
  [0,1,3,4,5].forEach(k=>{const x=12+k*39.5+27;s+=`<rect x="${x}" y="42" width="24" height="136" rx="5" fill="#142036" stroke="#000" stroke-width="2"/>`});
  s+='<rect x="4" y="30" width="332" height="16" rx="8" fill="#b3182f"/></svg>'; return s;}
function bateria(){ // 6 peças vistas de cima; o prato de ataque está aceso
  const P=[['bumbo',170,214,56,'#e8384f'],['caixa',96,170,40,'#f7b733'],['tom 1',112,92,36,'#3fb27f'],['tom 2',228,92,36,'#2fa8c4'],['surdo',250,176,42,'#3b6fd8'],['prato',48,40,34,'#f2762e']];
  let s='<svg viewBox="0 0 340 300" width="340" height="300"><ellipse cx="170" cy="160" rx="160" ry="136" fill="#7a1a2b" opacity=".6"/>';
  P.forEach((p,i)=>{const on=i===5;s+=`<g class="${on?'glow':''}">`+(p[0]==='prato'?`<circle cx="${p[1]}" cy="${p[2]}" r="${p[3]}" fill="#e9c46a" stroke="${on?'#fff':'#142036'}" stroke-width="${on?5:3}"/><circle cx="${p[1]}" cy="${p[2]}" r="${p[3]*.35}" fill="#b27a12"/>`:`<circle cx="${p[1]}" cy="${p[2]}" r="${p[3]}" fill="#fffdf7" stroke="#142036" stroke-width="4"/><circle cx="${p[1]}" cy="${p[2]}" r="${p[3]-9}" fill="${p[4]}"/>`)+`<text x="${p[1]}" y="${p[2]+4}" text-anchor="middle" font-family="Hanken Grotesk" font-weight="800" font-size="11" fill="#fff" style="paint-order:stroke;stroke:#142036;stroke-width:3px">${p[0]}</text></g>`});
  s+='<ellipse cx="300" cy="44" rx="34" ry="34" fill="#e9c46a" stroke="#142036" stroke-width="3"/><text x="300" y="48" text-anchor="middle" font-family="Hanken Grotesk" font-weight="800" font-size="11" fill="#142036">chimbal</text></svg>'; return s;}
function violao(){ // 6 cordas horizontais num braço com trastes; a 4ª vibra
  let s='<svg viewBox="0 0 340 300" width="340" height="300"><rect x="6" y="28" width="328" height="244" rx="14" fill="#7a4a26"/><rect x="6" y="28" width="328" height="244" rx="14" fill="url(#g)" opacity=".25"/><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#fff"/></linearGradient></defs>';
  [70,128,184,236,284,322].forEach(x=>{s+=`<rect x="${x}" y="28" width="4" height="244" fill="#d8d8d8"/>`});
  [[100,152],[160,208],[214,92]].forEach(([x,y])=>{s+=`<circle cx="${x}" cy="${y}" r="6" fill="#fffdf7" opacity=".85"/>`});
  const cs=['mi','lá','ré','sol','si','mi'],esp=[3.6,3,2.4,1.8,1.4,1.1];
  for(let i=0;i<6;i++){const y=52+i*40,on=i===3;s+=`<g class="${on?'glow':''}">`+(on?`<path d="M6 ${y} Q 90 ${y-14} 170 ${y} T 334 ${y}" fill="none" stroke="#fff6c2" stroke-width="${esp[i]+1.5}"/>`:`<line x1="6" y1="${y}" x2="334" y2="${y}" stroke="#e8e2cf" stroke-width="${esp[i]}"/>`)+`<circle cx="22" cy="${y}" r="13" fill="${COR[i]}" stroke="#fff" stroke-width="2.5"/><text x="22" y="${y+4}" text-anchor="middle" font-family="Hanken Grotesk" font-weight="800" font-size="12" fill="#fff">${cs[i]}</text></g>`}
  s+='</svg>'; return s;}
const dica={a:'listen',b:'',c:'',d:''};
const inst={a:xilo,b:piano,c:bateria,d:violao}[M]();
document.getElementById('app').innerHTML=`<div class="card"><div class="tag">MODELO ${M.toUpperCase()} · ${NOMES[M].toLowerCase()}</div>
<div class="head"><div class="back">‹ jogos</div><div class="ribbon">GENIUS · ${NOMES[M]}</div></div>
<div class="tabs">${['xilofone','piano','bateria','violão'].map((t,i)=>`<i class="${'abcd'[i]===M?'on':''}">${t}</i>`).join('')}</div>
<div class="stats"><div class="st"><b>7</b><small>rodada</small></div><div class="st"><b>7</b><small>notas</small></div><div class="st"><b>12</b><small>recorde</small></div></div>
<div class="msg">ouça… decore a sequência!</div>
<div class="stage">${inst}</div>
<div class="dock"><div class="rb"><i>👂</i>ouvir de novo</div><div class="rb main"><i>▶</i>começar</div><div class="rb"><i>🔊</i>som</div></div></div>`;
</script></body></html>
